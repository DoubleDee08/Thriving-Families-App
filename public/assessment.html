<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thriving Families — Diagnostic Genogram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#1B2A4A;--mid:#2E5077;--accent:#4A7FB5;--gold:#B8860B;--gold-light:#D4A017;--warn:#8B1A1A;--cream:#FDF8EE;--light-blue:#E8F0FA;--serpent:#6B3A2A;--jackal:#4A3B1A;--dragon:#1A2A4A;--wall:#2A4A2A;--bg:#F7F3EC;--white:#FFFFFF;--border:#D4C9B0;--text:#1B2A4A;--muted:#7A8A9A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Jost",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app-header{background:var(--deep);padding:20px 32px 16px;border-bottom:3px solid var(--gold)}
.app-header h1{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--white);letter-spacing:.5px}
.app-header p{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;font-weight:300;letter-spacing:1.5px;text-transform:uppercase}
.progress-bar{background:rgba(255,255,255,.1);height:3px;margin-top:14px;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .5s ease;border-radius:2px}
.step-indicators{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.step-dot{font-size:9px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border:1px solid rgba(255,255,255,.15);border-radius:10px;transition:all .3s}
.step-dot.active{color:var(--gold-light);border-color:var(--gold-light)}
.step-dot.done{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)}
.main{padding:24px 32px;max-width:860px}
.section-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.section-title{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:700;color:var(--deep);line-height:1.2;margin-bottom:8px}
.section-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:24px;max-width:620px}
.question-card{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:4px;padding:18px 20px;margin-bottom:16px}
.question-card.gold-card{border-left-color:var(--gold)}
.q-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.q-text{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600;color:var(--deep);margin-bottom:14px;line-height:1.4}
.q-sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5;font-style:italic}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.options-col{display:flex;flex-direction:column;gap:8px}
.option-btn{background:var(--light-blue);border:1.5px solid transparent;border-radius:4px;padding:10px 14px;text-align:left;cursor:pointer;font-family:"Jost",sans-serif;font-size:13px;color:var(--deep);line-height:1.4;transition:all .2s;font-weight:400}
.option-btn:hover{background:#D4E4F5;border-color:var(--accent)}
.option-btn.selected{background:var(--deep);color:var(--white);border-color:var(--deep)}
.scale-row{display:flex;gap:6px;align-items:center;margin-top:8px}
.scale-label{font-size:11px;color:var(--muted);min-width:60px}
.scale-label.right{text-align:right}
.scale-btns{display:flex;gap:4px;flex:1;justify-content:center}
.scale-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted);font-family:"Jost",sans-serif}
.scale-btn:hover{border-color:var(--accent);color:var(--accent)}
.scale-btn.selected{background:var(--deep);border-color:var(--deep);color:var(--white)}
.text-input{width:100%;border:1.5px solid var(--border);border-radius:4px;padding:10px 14px;font-family:"Jost",sans-serif;font-size:13px;color:var(--deep);background:var(--white);resize:vertical;min-height:70px;transition:border .2s;margin-top:6px}
.text-input:focus{outline:none;border-color:var(--accent)}
.person-block{background:var(--cream);border:1px solid var(--border);border-radius:4px;padding:16px 18px;margin-bottom:12px}
.person-block h4{font-family:"Cormorant Garamond",serif;font-size:15px;font-weight:700;color:var(--deep);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.person-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--white);flex-shrink:0}
.icon-m{background:var(--mid)}.icon-f{background:var(--warn)}.icon-c{background:var(--gold)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.field-select,.field-input{border:1.5px solid var(--border);border-radius:3px;padding:7px 10px;font-family:"Jost",sans-serif;font-size:12px;color:var(--deep);background:var(--white);transition:border .2s}
.field-select:focus,.field-input:focus{outline:none;border-color:var(--accent)}
.nav-row{display:flex;gap:12px;margin-top:28px;align-items:center}
.btn-next{background:var(--deep);color:var(--white);border:none;border-radius:4px;padding:12px 28px;font-family:"Jost",sans-serif;font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .2s}
.btn-next:hover{background:var(--mid)}
.btn-next:disabled{background:var(--border);cursor:not-allowed}
.btn-back{background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:4px;padding:12px 20px;font-family:"Jost",sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.btn-back:hover{color:var(--deep);border-color:var(--deep)}
.nav-hint{font-size:11px;color:var(--muted);margin-left:auto}
.divider{height:1px;background:var(--border);margin:20px 0}
.report-container{padding:0 32px 40px;max-width:860px}
.report-header{background:var(--deep);border-radius:6px 6px 0 0;padding:24px 28px}
.report-header h2{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:700;color:var(--white)}
.report-header p{font-size:12px;color:rgba(255,255,255,.55);margin-top:4px;letter-spacing:.5px}
.report-meta{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.report-meta-item{font-size:11px}
.report-meta-item span{color:var(--gold-light);font-weight:600}
.report-meta-item p{color:rgba(255,255,255,.6)}
.report-body{background:var(--white);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;padding:28px}
.score-section{margin-bottom:28px}
.score-section-title{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.creature-bars{display:flex;flex-direction:column;gap:10px}
.creature-bar-row{display:flex;align-items:center;gap:12px}
.creature-name{font-size:12px;font-weight:600;width:80px;flex-shrink:0;color:var(--deep)}
.bar-track{flex:1;height:10px;background:var(--light-blue);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width 1s ease}
.bar-serpent{background:linear-gradient(90deg,#8B3A2A,#C05A3A)}
.bar-jackal{background:linear-gradient(90deg,#7A6030,#B89040)}
.bar-dragon{background:linear-gradient(90deg,#2A3A6A,#4A6AAA)}
.bar-pct{font-size:11px;font-weight:600;color:var(--muted);width:36px;text-align:right}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.badge{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.badge-serpent{background:#FCE8E3;color:var(--serpent)}
.badge-jackal{background:#F5EDD8;color:var(--jackal)}
.badge-dragon{background:#E3E8F5;color:var(--dragon)}
.badge-primary{background:var(--deep);color:var(--white)}
.badge-wall{background:#E3F0E3;color:var(--wall)}
.badge-valley{background:var(--light-blue);color:var(--mid)}
.badge-bowen{background:#EEE8F8;color:#4A2A7A}
.diag-panel{border:1px solid var(--border);border-radius:4px;margin-bottom:16px;overflow:hidden}
.diag-panel-header{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.diag-panel-header h3{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:700;color:var(--deep);flex:1}
.diag-panel-header .chevron{color:var(--muted);font-size:12px;transition:transform .3s}
.diag-panel-header .chevron.open{transform:rotate(180deg)}
.diag-panel-body{padding:0 16px 16px;display:none}
.diag-panel-body.open{display:block}
.panel-serpent .diag-panel-header{background:#FDF3F0;border-bottom:2px solid #C05A3A}
.panel-jackal .diag-panel-header{background:#FAF5E8;border-bottom:2px solid #B89040}
.panel-dragon .diag-panel-header{background:#EEF0F8;border-bottom:2px solid #4A6AAA}
.panel-wall .diag-panel-header{background:#EEF5EE;border-bottom:2px solid #4A8A4A}
.panel-valley .diag-panel-header{background:var(--light-blue);border-bottom:2px solid var(--accent)}
.panel-bowen .diag-panel-header{background:#F3EEF8;border-bottom:2px solid #7A5AB8}
.panel-permu .diag-panel-header{background:#FDF8EE;border-bottom:2px solid var(--gold)}
.panel-lineage .diag-panel-header{background:#F0F4FA;border-bottom:2px solid var(--mid)}
.finding-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0EDE5;align-items:flex-start}
.finding-row:last-child{border-bottom:none}
.finding-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot-serpent{background:#C05A3A}.dot-jackal{background:#B89040}.dot-dragon{background:#4A6AAA}
.dot-wall{background:#4A8A4A}.dot-gold{background:var(--gold)}.dot-mid{background:var(--mid)}.dot-warn{background:var(--warn)}
.finding-text{font-size:13px;color:var(--deep);line-height:1.5}
.finding-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.genogram-canvas{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:20px;overflow-x:auto}
svg.genogram{width:100%;min-width:600px}
.counselor-notes{background:var(--cream);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:4px;padding:16px 18px;margin-bottom:16px}
.counselor-notes h4{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.counselor-notes ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.counselor-notes li{font-size:13px;color:var(--deep);padding-left:14px;position:relative;line-height:1.5}
.counselor-notes li::before{content:"→";position:absolute;left:0;color:var(--gold);font-size:11px;top:1px}
.action-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn-action{padding:10px 20px;border-radius:4px;font-family:"Jost",sans-serif;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .2s;border:1.5px solid var(--deep);background:transparent;color:var(--deep)}
.btn-action:hover{background:var(--deep);color:var(--white)}
.btn-action.primary{background:var(--deep);color:var(--white)}
.btn-action.primary:hover{background:var(--mid);border-color:var(--mid)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend-swatch{width:14px;height:14px;border-radius:2px;flex-shrink:0}
@media print{.app-header .step-indicators,.progress-bar,.nav-row,.action-row,.btn-back,.btn-next{display:none!important}.report-body{border:none}.diag-panel-body{display:block!important}}
@media(max-width:600px){.main,.report-container{padding:16px}.options-grid{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr}.report-meta{gap:12px}}
</style>
</head>
<body>
<div class="app-header">
  <h1>Thriving Families — Diagnostic Genogram</h1>
  <p>Family Assessment</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="step-indicators" id="stepIndicators"></div>
</div>
<div id="appContent"></div>
<div id="ehr-save-modal" style="display:none;position:fixed;inset:0;background:rgba(27,42,74,0.45);align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:999">
  <div style="background:var(--white);border-radius:10px;max-width:420px;width:100%;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,0.2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--deep);margin:0">Save to EHR</h3>
      <button onclick="ehrToggleSaveModal(false)" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)">✕</button>
    </div>
    <div id="ehr-panel-body"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── EHR integration ──────────────────────────────────────────────────
// Uses the same Supabase project and login (email sign-in link) as the
// practice's EHR. Nothing here is required to use the assessment itself —
// it only matters when clicking "Save to EHR" on the finished report.
const ehrSupabase = window.supabase.createClient(
  "https://kjtgvxcuimjlwwiiholm.supabase.co",
  "sb_publishable_mIq__c7pr2ra2UqACInrtQ_qJeKNco_"
);
const CLIENT_TOKEN = new URLSearchParams(location.search).get("t");
function isClientMode(){ return !!CLIENT_TOKEN; }
function isPractitioner(){ return !isClientMode() && !!(typeof ehr!=="undefined" && ehr && ehr.session); }

// ── Client link mode ─────────────────────────────────────────────────
// A client opens a private link (?t=...). They are never signed in. The page can
// only call three database functions, each of which needs the secret token.
const clientLink = { status:"loading", saveTimer:null, lastSent:"", submitting:false, error:"" };

async function clientBoot(){
  try{
    const { data, error } = await ehrSupabase.rpc("get_assessment_session",{ p_token: CLIENT_TOKEN });
    if(error) throw error;
    if(!data || data.status!=="ok"){ clientLink.status = (data&&data.status)||"invalid"; clientShowGate(); return; }
    if(data.progress && Object.keys(data.progress).length){ state.data = data.progress; state.step = Math.min(data.last_step||0, STEPS.length-2); }
    clientLink.status = "ok";
    renderStep();
  }catch(e){ clientLink.status="error"; clientShowGate(); }
}
function clientShowGate(){
  const msgs = {
    invalid:["This link isn't working","Please check that you copied the whole link, or ask your practitioner to send you a new one."],
    expired:["This link has expired","For your privacy, assessment links stop working after a while. Please ask your practitioner for a fresh link."],
    submitted:["Thank you \u2014 this assessment has already been submitted","Your answers were received and can\u2019t be changed. Your practitioner will be in touch."],
    error:["We couldn\u2019t reach the server","Please check your internet connection and refresh this page. Nothing you entered has been lost."]
  };
  const m = msgs[clientLink.status] || msgs.invalid;
  document.getElementById("appContent").innerHTML = '<div class="main"><div class="question-card" style="max-width:560px;margin:40px auto;text-align:center"><div class="q-text" style="font-size:20px">'+m[0]+'</div><div class="q-sub" style="margin-top:10px;line-height:1.7">'+m[1]+'</div></div></div>';
}
async function clientSaveNow(){
  if(!isClientMode()||clientLink.status!=="ok"||state.submitted) return;
  const payload = JSON.stringify(state.data);
  const key = payload+"|"+state.step;
  if(key===clientLink.lastSent) return;
  try{
    const { data } = await ehrSupabase.rpc("save_assessment_progress",{ p_token:CLIENT_TOKEN, p_progress:state.data, p_last_step:state.step });
    if(data===true) clientLink.lastSent = key;
  }catch(e){}
}
function clientQueueSave(){
  if(!isClientMode()||clientLink.status!=="ok") return;
  clearTimeout(clientLink.saveTimer);
  clientLink.saveTimer = setTimeout(clientSaveNow, 1500);
}
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden") clientSaveNow(); });
window.addEventListener("pagehide",function(){ clientSaveNow(); });

async function clientSubmit(){
  if(clientLink.submitting) return;
  clientLink.submitting = true; clientLink.error = "";
  renderStep();
  try{
    const { data, error } = await ehrSupabase.rpc("submit_assessment",{ p_token:CLIENT_TOKEN, p_answers:state.data, p_computed:buildEhrComputedPayload() });
    if(error) throw error;
    if(data!==true) throw new Error("Not accepted");
    state.submitted = true;
  }catch(e){
    clientLink.error = "We couldn\u2019t send your answers just now. Nothing is lost \u2014 please check your connection and try again.";
  }
  clientLink.submitting = false;
  renderStep();
}

const ehr = { session: null, households: [], selectedHouseholdId: "", status: "idle", error: "" };

async function ehrInit(){
  const { data } = await ehrSupabase.auth.getSession();
  ehr.session = data.session;
  ehrSupabase.auth.onAuthStateChange((_e, sess) => {
    ehr.session = sess;
    renderEhrPanel();
    if (typeof state !== "undefined" && state.step === STEPS.length - 1) renderStep();
  });
  if(ehr.session) await ehrLoadHouseholds();
  renderEhrPanel();
}

async function ehrLoadHouseholds(){
  try {
    const { data, error } = await ehrSupabase.from("household").select("id,name").order("name");
    if(error) throw error;
    ehr.households = data || [];
    if(ehr.households.length && !ehr.selectedHouseholdId) ehr.selectedHouseholdId = ehr.households[0].id;
  } catch(e){ ehr.error = e.message; }
}

async function ehrSendLink(email){
  ehr.status = "sending"; ehr.error = ""; renderEhrPanel();
  try {
    const { error } = await ehrSupabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href.split("#")[0] } });
    if(error) throw error;
    ehr.status = "link_sent";
  } catch(e){ ehr.error = e.message; ehr.status = "idle"; }
  renderEhrPanel();
}

function buildEhrComputedPayload(){
  const scores = computeScores();
  const ranked = getPrimary(scores);
  const permu = getPermutation(scores);
  const bp = getGenerationalBreakPoint();
  const fw = getFrameworkRecommendation();
  // Draft screening rules \u2014 to be reviewed by Damilare. These only prompt a
  // closer look; they are not a clinical determination.
  const pp0 = state.data.presenting_problems || [];
  const refFlags = [];
  if(pp0.includes("addiction")) refFlags.push("Addiction or substance use was selected \u2014 consider whether specialist treatment is needed alongside or instead of coaching.");
  if(pp0.includes("mental_health")) refFlags.push("A mental health crisis was selected \u2014 consider referral to a licensed clinician.");
  if(["h_trauma","w_trauma"].some(k=>{const v=state.data[k]; return v && (Array.isArray(v)?v.includes("abuse"):String(v).includes("abuse"));})) refFlags.push("Abuse history was indicated \u2014 consider safety and trauma-informed referral.");
  return {
    client_name: state.data.client_name || null,
    population: state.data.population || null,
    presenting_problems: state.data.presenting_problems || [],
    scores, primary: ranked[0].name, permutation: permu,
    generational_break_point: bp,
    suggested_framework: fw[0], runner_up_framework: fw[1]&&fw[1].val>0?fw[1]:null,
    framework_scores: fw,
    referral_flags: refFlags,
    needs_referral_review: refFlags.length>0,
  };
}

async function ehrSaveReport(){
  if(!ehr.selectedHouseholdId){ ehr.error = "Choose a household first."; renderEhrPanel(); return; }
  ehr.status = "saving"; ehr.error = ""; renderEhrPanel();
  try {
    const { count } = await ehrSupabase.from("assessment_report").select("id", { count: "exact", head: true }).eq("household_id", ehr.selectedHouseholdId);
    const { error } = await ehrSupabase.from("assessment_report").insert({
      household_id: ehr.selectedHouseholdId,
      version_number: (count || 0) + 1,
      computed: buildEhrComputedPayload(),
      divergence: [],
    });
    if(error) throw error;
    ehr.status = "saved";
  } catch(e){ ehr.error = e.message; ehr.status = "idle"; }
  renderEhrPanel();
}

function ehrToggleSaveModal(show){
  document.getElementById("ehr-save-modal").style.display = show ? "flex" : "none";
  if(show){ ehr.status = "idle"; ehr.error = ""; if(ehr.session) ehrLoadHouseholds().then(renderEhrPanel); renderEhrPanel(); }
}

function renderEhrPanel(){
  const el = document.getElementById("ehr-panel-body");
  if(!el) return;
  let h = "";
  if(!ehr.session){
    if(ehr.status === "link_sent"){
      h = `<div style="font-size:13px;line-height:1.6;color:var(--text)">Check your email for a sign-in link, then come back to this tab.</div>`;
    } else {
      h = `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Sign in with your practice email to save this report to the EHR.</div>
        <input id="ehr-email" type="email" placeholder="you@yourpractice.org" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:10px;box-sizing:border-box">
        <button class="btn-action primary" style="width:100%" onclick="ehrSendLink(document.getElementById('ehr-email').value)">Send sign-in link</button>`;
    }
  } else if(ehr.status === "saved"){
    h = `<div style="font-size:13px;color:#2A6A2A;font-weight:600">Saved to the EHR record.</div>`;
  } else {

function computeScores(){const d=state.data;let s=0,j=0,dr=0;["hidden_secrets","performance_culture","truth_distortion","spiritual_reframe","role_distortion"].forEach(k=>{if(d[k])s+=parseInt(d[k])||0});if(d.communication_pattern==="managed")s+=3;if(d.communication_pattern==="silent")s+=2;if(d.conflict_styles&&d.conflict_styles.includes("avoid"))s+=2;if(d.conflict_styles&&d.conflict_styles.includes("managed"))s+=2;if(d.conflict_styles&&d.conflict_styles.includes("silent"))s+=2;if(d.conflict_styles&&d.conflict_styles.includes("spiritual"))s+=3;if(d.conflict_styles&&d.conflict_styles.includes("explosive")&&d.conflict_styles.includes("unresolved"))dr+=2;if(d.conflict_styles&&d.conflict_styles.includes("cyclical"))j+=2;if(getVal('identity_source')==="performance")s+=3;["unprocessed_grief","behavioral_crisis","relational_voids","deferred_hope","external_intrusion"].forEach(k=>{if(d[k])j+=parseInt(d[k])||0});if(d.presenting_problems&&d.presenting_problems.includes("child_behavior"))j+=3;if(d.presenting_problems&&d.presenting_problems.includes("addiction"))j+=4;if(d.presenting_problems&&d.presenting_problems.includes("grief"))j+=3;if(d.presenting_problems&&d.presenting_problems.includes("intimacy"))j+=2;if(d.presenting_problems&&d.presenting_problems.includes("generational"))dr+=3;if(d.presenting_problems&&d.presenting_problems.includes("identity"))s+=2;if(d.presenting_problems&&d.presenting_problems.includes("faith"))s+=2;if(d.presenting_problems&&d.presenting_problems.includes("communication"))s+=2;if(d.loss_history==="major")j+=3;if(d.loss_history==="multiple")j+=4;["generational_pattern","chaos_culture","identity_loss","fatalist_theology","systemic_barrier"].forEach(k=>{if(d[k])dr+=parseInt(d[k])||0});["h_chaos_culture","w_chaos_culture","h_identity_loss","w_identity_loss","h_fatalist_theology","w_fatalist_theology","h_systemic_barrier","w_systemic_barrier"].forEach(k=>{if(d[k])dr+=Math.round((parseInt(d[k])||0)/2);});if(d.pattern_generations==="3plus")dr+=5;if(d.patter function getGenerationalBreakPoint(){

    if(g1==="no")return{status:"no_inherited_pattern",label:"No inherited pattern detected",desc:"This lineage does not appear to carry the pattern from the grandparent generation forward."};
    if(!g2||g2==="unknown")return{status:"unclear",label:"Grandparent pattern present; parent generation unclear",desc:"The pattern was present two generations back, but there isn't enough information about whether it continued, lessened, or broke in the parent generation."};
    if(g2==="broke")return{status:"break_at_parents",label:"Break point: parent generation",desc:"This lineage's parent generation already interrupted the pattern. Restoration work here should protect and reinforce an already-won position, not start from zero."};

      ${divergences.map(dv=>`<div style="font-size:12px;color:var(--deep);padding:6px 0;border-bottom:1px solid var(--border);line-height:1.5"><strong>${dv.question}:</strong> ${dv.flag}</div>`).join("")}

}

function renderDragon(){
  var d=state.data;
  var pop=d.population;
  var isCouple=(pop==="couple"||pop==="family");

  // ── Question definitions ──────────────────────────────────────────────
  var genOpts=[
    {val:"current",label:"This generation only — this is new"},
    {val:"2gen",label:"2 generations — I saw it in my parents"},
    {val:"3plus",label:"3+ generations — it runs deep in the family line"},
    {val:"unknown",label:"Unknown — I cannot trace it back"}
  ];
  var cultureOpts=[
    {val:"covenant",label:"Covenant order — structured, purposeful"},
    {val:"functional",label:"Functional but no covenant architecture"},
    {val:"survival",label:"Survival-organized — chronic crisis management"},
    {val:"chaos",label:"Chaos as the norm — instability is the baseline"}
  ];
  var g1Opts=[
    {val:"yes",label:"Yes — my grandparents' generation showed this same core pattern"},
    {val:"no",label:"No — I don't believe it was present in that generation"},
    {val:"unknown",label:"Unknown — I don't have enough information about that generation"}
  ];
  var g2Opts=[
    {val:"same",label:"About the same as my grandparents' generation"},
    {val:"better",label:"Somewhat better — some progress, but not fully broken"},
    {val:"broke",label:"Broke the pattern completely"},
    {val:"worse",label:"Worse — the pattern intensified in this generation"},
    {val:"unknown",label:"Unknown"}
  ];

  // ── Divergence analysis ───────────────────────────────────────────────
  function getDivergences(){
    var divs=[];
    var hGen=d.h_pattern_generations; var wGen=d.w_pattern_generations;
    if(hGen&&wGen&&hGen!==wGen){
      var severity={current:1,"2gen":2,"3plus":3,unknown:0};
      var hSev=severity[hGen]||0; var wSev=severity[wGen]||0;
      var deeper=hSev>wSev?"Him":"Her";
      var shallower=hSev>wSev?"Her":"Him";
      divs.push({
        q:"How far back the pattern goes",
        him:genOpts.find(function(o){return o.val===hGen;})||{label:hGen},
        her:genOpts.find(function(o){return o.val===wGen;})||{label:wGen},
        flag:deeper+" sees the pattern running deeper. This divergence is clinically significant — the spouse who sees deeper lineage roots is either closer to the dragon in their own history, or has done more reflection on where the pattern came from. The spouse who sees it as shallower may not yet recognise what they brought in from their own lineage, or may be protecting their family of origin from examination. Either way, the divergence tells you which lineage the Foundation Crack is most active in right now.",
        color:"var(--warn)"
      });
    }
    var hCult=d.h_family_culture; var wCult=d.w_family_culture;
    if(hCult&&wCult&&hCult!==wCult){
      divs.push({
        q:"The family's governing culture",
        him:cultureOpts.find(function(o){return o.val===hCult;})||{label:hCult},
        her:cultureOpts.find(function(o){return o.val===wCult;})||{label:wCult},
        flag:"Different governing cultures were brought into this marriage from each family of origin. What one spouse calls normal, the other may call dysfunction — and vice versa. This divergence is the Foundation Crack's most common entry point into a new household: not through dramatic failure but through the quiet collision of two incompatible definitions of what a family is.",
        color:"var(--warn)"
      });
    }
    // Scale divergences
    var scaleKeys=[
      {hk:"h_chaos_culture",wk:"w_chaos_culture",label:"How normalized chaos feels"},
      {hk:"h_identity_loss",wk:"w_identity_loss",label:"Degree of identity loss"},
      {hk:"h_fatalist_theology",wk:"w_fatalist_theology",label:"Fatalistic theology"},
      {hk:"h_systemic_barrier",wk:"w_systemic_barrier",label:"Systemic barriers to change"}
    ];
    scaleKeys.forEach(function(sk){
      var hv=parseInt(d[sk.hk])||0; var wv=parseInt(d[sk.wk])||0;
      if(hv&&wv&&Math.abs(hv-wv)>=2){
        var higher=hv>wv?"Him":"Her";
        var gap=Math.abs(hv-wv);
        divs.push({
          q:sk.label,
          him:{label:"Him: "+hv+"/5"},
          her:{label:"Her: "+wv+"/5"},
          flag:higher+" scores this "+gap+" points higher. A gap of 2 or more on this dimension means the two spouses are living in different experiential realities regarding the generational pattern. The spouse who scores it higher is closer to it — either because their lineage carries it more heavily, or because they are more honest about its presence. The spouse who scores it lower may be minimising, may not yet see it, or may have come from a lineage where it operates more subtly.",
          color:gap>=3?"#8B1A1A":"var(--warn)"
        });
      }
    });
    return divs;
  }

  // ── Render helpers ────────────────────────────────────────────────────
  function renderOptRow(label,hKey,wKey,opts,sub){
    var hCur=d[hKey]||null; var wCur=d[wKey]||null;
    var aligned=hCur&&wCur&&hCur===wCur;
    var diverged=hCur&&wCur&&hCur!==wCur;
    var h='<div class="question-card">';
    h+='<div class="q-text">'+label+'</div>';
    if(sub)h+='<div class="q-sub">'+sub+'</div>';
    if(isCouple){
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">';
      // Him column
      h+='<div><div class="field-label" style="margin-bottom:8px;display:flex;align-items:center;gap:6px"><div class="person-icon icon-m" style="width:20px;height:20px;font-size:10px">H</div>His view</div>';
      h+='<div class="options-col" style="gap:5px">';
      opts.forEach(function(o){
        var sel=(hCur===o.val);
        h+='<button class="option-btn '+(sel?"selected":"")+'" onclick="save(\''+hKey+'\',\''+o.val+'\');renderStep()" style="font-size:11px;padding:7px 10px;text-align:left">'+o.label+'</button>';
      });
      h+="</div></div>";
      // Her column
      h+='<div><div class="field-label" style="margin-bottom:8px;display:flex;align-items:center;gap:6px"><div class="person-icon icon-f" style="width:20px;height:20px;font-size:10px">W</div>Her view</div>';
      h+='<div class="options-col" style="gap:5px">';
      opts.forEach(function(o){
        var sel=(wCur===o.val);
        h+='<button class="option-btn '+(sel?"selected":"")+'" onclick="save(\''+wKey+'\',\''+o.val+'\');renderStep()" style="font-size:11px;padding:7px 10px;text-align:left">'+o.label+'</button>';
      });
      h+="</div></div></div>";
      if(aligned&&!isClientMode())h+='<div style="margin-top:8px;padding:6px 10px;background:#E3F0E3;border-left:3px solid #4A8A4A;border-radius:3px;font-size:11px;color:#2A4A2A">Both aligned — shared perception of this dimension.</div>';
      if(diverged&&!isClientMode())h+='<div style="margin-top:8px;padding:6px 10px;background:#FDF3F0;border-left:3px solid var(--warn);border-radius:3px;font-size:11px;color:var(--warn)">Views diverge — see report for diagnostic implications.</div>';
    } else {
      h+='<div class="options-grid">';
      opts.forEach(function(o){
        var key=hKey.replace('h_','');
        var cur=d[key]||null;
        h+='<button class="option-btn '+(cur===o.val?"selected":"")+'" onclick="save(\''+key+'\',\''+o.val+'\');renderStep()">'+o.label+'</button>';
      });
      h+='</div>';
    }
    h+='</div>';
    return h;
  }

  function renderScaleRow(label,hKey,wKey,lowLabel,highLabel,sub){
    var hCur=d[hKey]||null; var wCur=d[wKey]||null;
    var gap=(hCur&&wCur)?Math.abs(parseInt(hCur)-parseInt(wCur)):0;
    var h='<div class="question-card gold-card">';
    h+='<div class="q-label">'+label+'</div>';
    if(sub)h+='<div class="q-sub">'+sub+'</div>';
    if(isCouple){
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px">';
      [{key:hKey,label:"Him",icon:"icon-m",letter:"H"},{key:wKey,label:"Her",icon:"icon-f",letter:"W"}].forEach(function(p){
        var cur=d[p.key]||null;
        h+='<div><div class="field-label" style="margin-bottom:8px;display:flex;align-items:center;gap:6px"><div class="person-icon '+p.icon+'" style="width:20px;height:20px;font-size:10px">'+p.letter+'</div>'+p.label+'</div>';
        h+='<div class="scale-row" style="flex-wrap:wrap"><div class="scale-label" style="min-width:50px;font-size:10px">'+lowLabel+'</div>';
        h+='<div class="scale-btns">';
        for(var n=1;n<=5;n++){h+='<button class="scale-btn '+(cur==n?"selected":"")+ '" data-scale-key="'+p.key+'" data-scale-val="'+n+'" onclick="save(\''+p.key+'\','+n+');renderStep()">'+n+'</button>';}
        h+='</div><div class="scale-label right" style="min-width:50px;font-size:10px">'+highLabel+'</div></div></div>';
      });
      h+='</div>';
      if(gap>=2&&!isClientMode()){
        var col=gap>=3?"#8B1A1A":"var(--warn)";
        h+='<div style="margin-top:8px;padding:6px 10px;background:#FDF3F0;border-left:3px solid '+col+';border-radius:3px;font-size:11px;color:'+col+'">Gap of '+gap+' points detected — the two spouses are experiencing this dimension differently. See report for diagnostic implications.</div>';
      } else if(hCur&&wCur&&gap===0&&!isClientMode()){
        h+='<div style="margin-top:8px;padding:6px 10px;background:#E3F0E3;border-left:3px solid #4A8A4A;border-radius:3px;font-size:11px;color:#2A4A2A">Aligned — shared perception of this dimension.</div>';
      }
    } else {
      var key=hKey.replace('h_','');
      var cur=d[key]||null;
      h+='<div class="scale-row"><div class="scale-label">'+lowLabel+'</div><div class="scale-btns">';
      for(var n=1;n<=5;n++){h+='<button class="scale-btn '+(cur==n?"selected":"")+ '" data-scale-key="'+key+'" data-scale-val="'+n+'" onclick="save(\''+key+'\','+n+');renderStep()">'+n+'</button>';}
      h+='</div><div class="scale-label right">'+highLabel+'</div></div>';
    }
    h+='</div>';
    return h;
  }

  // ── Build step ────────────────────────────────────────────────────────
  var divs=isCouple?getDivergences():[];

  var out='<div class="main">';
  out+='<div class="section-label">Step 6 of ${STEPS.length-1} — The Foundation Crack Assessment</div>';
  out+='<div class="section-title">The Foundation Crack — Generational Entrenchment Indicators</div>';
  out+='<div class="section-desc">The Foundation Crack is chaos become culture — the generational pattern that no longer feels abnormal because it is the family\'s inheritance.'+(isCouple?' Each person answers from their own experience of the pattern. Where your answers differ, the gap itself is a diagnostic finding.':'')+'</div>';

  out+=renderOptRow("How many generations does the primary dysfunction pattern span?","h_pattern_generations","w_pattern_generations",genOpts,"Answer from your own family line, not the household you have built together.");
  out+=renderOptRow("Did your grandparents' generation show this same core pattern?","h_g1_pattern","w_g1_pattern",g1Opts,"Think as far back as you have reliable knowledge of that generation.");
  out+=renderOptRow("Compared to your grandparents, your parents' generation was:","h_g2_shift","w_g2_shift",g2Opts,"This identifies whether — and where — the pattern was ever interrupted before it reached you.");
  out+=renderOptRow("How would you describe the family's governing culture?","h_family_culture","w_family_culture",cultureOpts,"The emotional atmosphere and relational architecture of the household you grew up in.");
  out+=renderScaleRow("Degree to which chaos feels normal","h_chaos_culture","w_chaos_culture","None","Fully normalized","Dysfunction no longer registers as abnormal in my family experience");
  out+=renderScaleRow("Degree of identity loss","h_identity_loss","w_identity_loss","None","Complete","Self-definition feels inseparable from the family pattern");
  out+=renderScaleRow("Evidence of fatalistic theology","h_fatalist_theology","w_fatalist_theology","None","Dominant",'"This is just who we are" — the belief that the pattern cannot change');
  out+=renderScaleRow("Systemic barriers to change","h_systemic_barrier","w_systemic_barrier","None","Every attempt fails","Every effort at restoration is undermined by the weight of the pattern");

  // Live divergence preview
  if(divs.length>0){
    out+='<div style="background:var(--cream);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:4px;padding:14px 16px;margin-top:4px">';
    out+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--warn);margin-bottom:10px">'+divs.length+' Divergence'+(divs.length!==1?'s':'')+' Detected — Diagnostic Preview</div>';
    divs.forEach(function(dv){
      out+='<div style="padding:8px 0;border-bottom:1px solid var(--border)">';
      out+='<div style="font-size:12px;font-weight:600;color:var(--deep);margin-bottom:4px">'+dv.q+'</div>';
      out+='<div style="font-size:11px;color:var(--mid);margin-bottom:6px">Him: '+dv.him.label+' · Her: '+dv.her.label+'</div>';
      out+='<div style="font-size:12px;color:var(--deep);line-height:1.5;padding:6px 10px;background:#FDF3F0;border-radius:3px;border-left:2px solid '+dv.color+'">'+dv.flag+'</div>';
      out+='</div>';
    });
    out+='</div>';
  }

  out+=navRow(true);
  out+='</div>';
  return out;
}


function getGateHTML(){

  var domains=[

    ]},
    {domain:"Transition & Purging",color:"#4A7FB5",gates:[

      {key:"gate_dung",name:"Dung Gate",

    {domain:"Nourishment & Warfare",color:"#2A4A2A",gates:[

       desc:"Your family's relationship to Scripture, spiritual teaching, and the Word of God as the governing framework for household decisions."},
      {key:"gate_horse",name:"Horse Gate",
       plain:"Does your family have a posture of active intercession and spiritual alertness — or does it only respond to crises after they have already arrived?",
       desc:"Your family's spiritual warfare posture — the capacity to recognize spiritual attack, intercede ahead of crises, and stand in the gap."}
    ]},
    {domain:"Accountability",color:"#4A2A7A",gates:[
      {key:"gate_miphkad",name:"Miphkad Gate",
       plain:"Does your family have any regular, honest process of self-assessment — individually and together?",
       desc:"Your family's accountability structures — the regular, honest assessment of how the household is functioning."}
    ]}
  ];

  var holderOpts=[
    {v:"both",l:"Both of us — shared governance"},
    {v:"me",l:"Mainly me — I carry this gate"},
    {v:"spouse",l:"Mainly my spouse — they carry this gate"},
    {v:"neither",l:"Neither of us — this gate is ungoverned"},
    {v:"contested",l:"Contested — we pull in opposite directions on this"}
  ];

  var h='<div class="question-card" style="border-left-color:var(--gold)">';
  h+='<div class="q-label">Gate Assessment — Eight Gates of Jerusalem</div>';
  h+='<div class="q-sub">Each gate governs a specific domain of the family you are building together — not your family of origin. Rate the condition of each gate in your current household: how well it is functioning as a governing threshold for what enters and leaves the covenant you are building.</div>';
  h+='<div style="font-size:11px;color:var(--muted);margin-bottom:16px;padding:8px 12px;background:var(--light-blue);border-radius:4px">In ancient warfare, gates were taken before walls fell. The gate\'s condition reveals where governance failed first — before the structural deterioration became visible. These questions are about the household you are currently building, not the households you came from. Your family of origin\'s patterns are assessed separately in the Foundation Crack and Lineage steps.</div>';
  h+='</div>';

  domains.forEach(function(dom){
    h+='<div style="margin-bottom:20px">';
    h+='<div style="font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:'+dom.color+';margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid '+dom.color+'">'+dom.domain+'</div>';

    dom.gates.forEach(function(gate){
      var cur=d[gate.key]||null;
      var holder=d[gate.key+'_holder']||null;
      var showHolder=isCouple&&cur&&parseInt(cur)<=4;

      h+='<div class="question-card gold-card" style="border-left-color:'+dom.color+';margin-bottom:10px">';
      h+='<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">';
      h+='<div style="background:'+dom.color+';color:#fff;border-radius:3px;padding:3px 8px;font-size:10px;font-weight:600;white-space:nowrap;margin-top:2px">'+gate.name+'</div>';
      h+='<div style="font-size:13px;font-weight:600;color:var(--deep);line-height:1.4;font-family:Cormorant Garamond,serif">'+gate.plain+'</div>';
      h+='</div>';
      h+='<div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5;font-style:italic">'+gate.desc+'</div>';
      h+='<div class="scale-row"><div class="scale-label" style="min-width:80px;font-size:11px">Closed / Destroyed</div>';
      h+='<div class="scale-btns">';
      for(var n=1;n<=5;n++){
        h+='<button class="scale-btn '+(cur==n?"selected":"")+ '" data-scale-key="'+gate.key+'" data-scale-val="'+n+'" onclick="save(\''+gate.key+'\','+n+');renderStep()">'+n+'</button>';
      }
      h+='</div><div class="scale-label right" style="min-width:80px;font-size:11px">Fully Governing</div></div>';

      if(cur&&!isClientMode()){
        var lvl=parseInt(cur);
        var cond=lvl<=2?'<span style="color:var(--warn);font-weight:600">Gate condition: Severely compromised — this is an active breach point</span>':
                 lvl===3?'<span style="color:#B8860B;font-weight:600">Gate condition: Partially functioning — inconsistent governance</span>':
                 '<span style="color:#4A8A4A;font-weight:600">Gate condition: Functioning — maintain under pressure</span>';
        h+='<div style="font-size:11px;margin-top:8px">'+cond+'</div>';
      }

      // Per-gate holder question for couples when gate is not fully functioning
      if(showHolder){
        h+='<div style="margin-top:12px;padding:10px 14px;background:#F0F4FA;border-radius:4px;border-left:3px solid '+dom.color+'">';
        h+='<div style="font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:'+dom.color+';margin-bottom:8px">Who is holding this gate in your household?</div>';
        h+='<div style="display:flex;flex-direction:column;gap:6px">';
        holderOpts.forEach(function(opt){
          var sel=(holder===opt.v);
          h+='<button class="option-btn '+(sel?"selected":"")+'" data-holder-key="'+gate.key+'_holder" data-holder-val="'+opt.v+'" onclick="save(\''+gate.key+'_holder\',\''+opt.v+'\');renderStep()" style="font-size:12px;padding:8px 12px;text-align:left">'+opt.l+'</button>';
        });
        h+='</div>';

        // Show immediate clinical note based on holder selection
        if(holder){
          var note="";
          var noteColor="var(--mid)";
          if(holder==="me"||holder==="spouse"){
            var who=holder==="me"?"You are":"Your spouse is";
            note=who+" carrying this gate alone. A gate held by one person is structurally unstable — the moment that person\'s capacity is depleted, the gate falls. This is the Rephidim condition: arms too heavy with no one holding them up alongside you.";
            noteColor="var(--warn)";
          } else if(holder==="neither"){
            note="This gate is ungoverned. Neither spouse is covering this domain. Whatever enters through this gate is determined by external forces, circumstance, or the patterns running in from either lineage.";
            noteColor="var(--warn)";
          } else if(holder==="contested"){
            note="A contested gate is the most dangerous condition. One spouse trying to hold the gate while the other undermines it is the pattern of inside collapse — the enemy does not need to breach from outside when the conflict is internal.";
            noteColor="#8B1A1A";
          } else if(holder==="both"){
            note="Shared governance at this gate is a protective factor. Both spouses holding this domain reduces structural vulnerability and models covenant partnership for the children.";
            noteColor="#4A8A4A";
          }
          if(note){
            h+='<div style="margin-top:10px;padding:8px 12px;background:var(--cream);border-left:3px solid '+noteColor+';border-radius:3px;font-size:12px;color:var(--deep);line-height:1.6">'+note+'</div>';
          }
        }
        h+='</div>';
      }

      h+='</div>'; // end gate card
    });
    h+='</div>'; // end domain
  });

  // Gate summary
  var answered=Object.keys(d).filter(function(k){return k.startsWith('gate_')&&!k.includes('_holder')&&d[k];});
  if(answered.length>=4&&!isClientMode()){
    var severely=answered.filter(function(k){return parseInt(d[k])<=2;});
    var partial=answered.filter(function(k){return parseInt(d[k])===3;});
    var functioning=answered.filter(function(k){return parseInt(d[k])>=4;});
    var gateNames={gate_sheep:'Sheep Gate',gate_fish:'Fish Gate',gate_old:'Old Gate',gate_valley:'Valley Gate',gate_dung:'Dung Gate',gate_water:'Water Gate',gate_horse:'Horse Gate',gate_miphkad:'Miphkad Gate'};
    var soleHolder=answered.filter(function(k){return d[k+'_holder']==='me'||d[k+'_holder']==='spouse';});
    var contested=answered.filter(function(k){return d[k+'_holder']==='contested';});
    var neither=answered.filter(function(k){return d[k+'_holder']==='neither';});

    h+='<div style="background:var(--cream);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:4px;padding:16px 18px;margin-top:8px">';
    h+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px">Gate Assessment Summary — '+answered.length+' of 8 Gates Assessed</div>';

    if(severely.length>0){
      h+='<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:var(--warn);margin-bottom:4px">'+severely.length+' gate'+(severely.length!==1?'s':'')+' severely compromised:</div>';
      h+='<div style="font-size:12px;color:var(--deep)">'+severely.map(function(k){return gateNames[k];}).join(' · ')+'</div></div>';
    }
    if(partial.length>0){
      h+='<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#B8860B;margin-bottom:4px">'+partial.length+' gate'+(partial.length!==1?'s':'')+' partially functioning:</div>';
      h+='<div style="font-size:12px;color:var(--deep)">'+partial.map(function(k){return gateNames[k];}).join(' · ')+'</div></div>';
    }
    if(soleHolder.length>0){
      h+='<div style="margin-bottom:8px;padding:8px 12px;background:#FDF3F0;border-radius:3px"><div style="font-size:11px;font-weight:600;color:var(--warn);margin-bottom:4px">'+soleHolder.length+' gate'+(soleHolder.length!==1?'s':'')+' held by one spouse alone:</div>';
      h+='<div style="font-size:12px;color:var(--deep)">'+soleHolder.map(function(k){return gateNames[k];}).join(' · ')+'</div>';
      h+='<div style="font-size:11px;color:var(--warn);margin-top:4px">Gates designed for shared governance are being carried by one person. This is a depletion pathway — and a generational transmission risk.</div></div>';
    }
    if(contested.length>0){
      h+='<div style="margin-bottom:8px;padding:8px 12px;background:#FDF0F0;border-radius:3px"><div style="font-size:11px;font-weight:600;color:#8B1A1A;margin-bottom:4px">'+contested.length+' gate'+(contested.length!==1?'s':'')+' contested between spouses:</div>';
      h+='<div style="font-size:12px;color:var(--deep)">'+contested.map(function(k){return gateNames[k];}).join(' · ')+'</div>';
      h+='<div style="font-size:11px;color:#8B1A1A;margin-top:4px">Contested gates are under internal siege. This is the most dangerous condition — the fracture is inside the wall, not outside it.</div></div>';
    }
    if(neither.length>0){
      h+='<div style="margin-bottom:8px;padding:8px 12px;background:#F5F0FF;border-radius:3px"><div style="font-size:11px;font-weight:600;color:#4A2A7A;margin-bottom:4px">'+neither.length+' gate'+(neither.length!==1?'s':'')+' with no governance at all:</div>';
      h+='<div style="font-size:12px;color:var(--deep)">'+neither.map(function(k){return gateNames[k];}).join(' · ')+'</div>';
      h+='<div style="font-size:11px;color:#4A2A7A;margin-top:4px">Ungoverned gates determine nothing — they allow everything. Whatever pattern is strongest in either lineage will fill the vacuum.</div></div>';
    }

    if(severely.length>=3){
      h+='<div style="margin-top:8px;padding:8px 12px;background:#FDF3F0;border-radius:3px;font-size:12px;color:var(--warn);line-height:1.5">Multiple gate failures indicate governance collapse preceded wall deterioration. The pattern of which domains fell first is diagnostically significant.</div>';
    }
    if(severely.length>0&&d.gate_sheep<=2&&d.gate_water<=2){
      h+='<div style="margin-top:8px;padding:8px 12px;background:#FDF3F0;border-radius:3px;font-size:12px;color:var(--warn);line-height:1.5">Sheep Gate and Water Gate both compromised — no purification threshold and no governing truth framework. The Breach pattern has open access.</div>';
    }
    h+='</div>';
  }
  return h;
}

function getGateReportHTML(){
  var d=state.data;
  var gateKeys=['gate_sheep','gate_fish','gate_old','gate_valley','gate_dung','gate_water','gate_horse','gate_miphkad'];
  var gateNames={gate_sheep:'Sheep Gate',gate_fish:'Fish Gate',gate_old:'Old Gate',gate_valley:'Valley Gate',gate_dung:'Dung Gate',gate_water:'Water Gate',gate_horse:'Horse Gate',gate_miphkad:'Miphkad Gate'};
  var domainMap={gate_sheep:'Spiritual Consecration',gate_fish:'Provision',gate_old:'Heritage',gate_valley:'Transition',gate_dung:'Purging',gate_water:'Nourishment',gate_horse:'Warfare',gate_miphkad:'Accountability'};
  var creatureMap={gate_sheep:'The Breach / The Foundation Crack',gate_fish:'The Ruin / The Breach',gate_old:'The Foundation Crack',gate_valley:'All three patterns',gate_dung:'The Breach / The Ruin',gate_water:'The Breach / The Foundation Crack',gate_horse:'The Foundation Crack / The Ruin',gate_miphkad:'The Breach'};
  var holderLabel={both:'Shared — both spouses',me:'One spouse carrying alone',spouse:'One spouse carrying alone',neither:'Ungoverned — neither spouse',contested:'Contested — internal conflict'};

  var answered=gateKeys.filter(function(k){return d[k];});
  if(answered.length===0)return'';

  var severely=answered.filter(function(k){return parseInt(d[k])<=2;});
  var soleHolder=answered.filter(function(k){return d[k+'_holder']==='me'||d[k+'_holder']==='spouse';});
  var contested=answered.filter(function(k){return d[k+'_holder']==='contested';});
  var neither=answered.filter(function(k){return d[k+'_holder']==='neither';});
  var isCouple=(d.population==="couple"||d.population==="family");

  var h='<div class="diag-panel" style="border-color:var(--gold)">';
  h+='<div class="diag-panel-header" style="background:#FDF8EE;border-bottom:2px solid var(--gold)" onclick="togglePanel(this)">';
  h+='<h3>Gate Assessment — '+answered.length+'/8 Gates · '+severely.length+' Severely Compromised'+(soleHolder.length>0?' · '+soleHolder.length+' Held Alone':'')+(contested.length>0?' · '+contested.length+' Contested':'')+'</h3>';
  h+='<div class="chevron">▼</div></div>';
  h+='<div class="diag-panel-body">';

  // Gate-by-gate findings
  answered.forEach(function(k){
    var score=parseInt(d[k]);
    var holder=d[k+'_holder'];
    var color=score<=2?'var(--warn)':score===3?'#B8860B':'#4A8A4A';
    var label=score<=2?'Severely compromised':score===3?'Partially functioning':'Functioning';
    h+='<div class="finding-row"><div class="finding-dot" style="background:'+color+'"></div>';
    h+='<div><div class="finding-text">'+gateNames[k]+' ('+domainMap[k]+') — '+label+' ('+score+'/5)'+(holder&&isCouple?' · '+holderLabel[holder]:'')+'</div>';
    if(score<=2)h+='<div class="finding-sub" style="color:var(--warn)">Primary pattern entry through this gate: '+creatureMap[k]+'</div>';
    if(holder==='me'||holder==='spouse')h+='<div class="finding-sub" style="color:var(--warn)">Sole governance — one spouse carrying this alone. Depletion pathway active. Children observe governance without partnership.</div>';
    if(holder==='contested')h+='<div class="finding-sub" style="color:#8B1A1A">Contested governance — internal siege condition. The threat is not from outside the wall but from inside the household. This is the most dangerous gate configuration.</div>';
    if(holder==='neither')h+='<div class="finding-sub" style="color:#4A2A7A">No governance — this domain is fully open to whatever pattern is strongest in either lineage or the surrounding culture.</div>';
    h+='</div></div>';
  });

  // One-spouse gate analysis
  if(isCouple&&soleHolder.length>0){
    h+='<div style="margin-top:16px;padding:12px 16px;background:#FDF3F0;border-left:3px solid var(--warn);border-radius:4px">';
    h+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--warn);margin-bottom:8px">One-Spouse Gate Condition — '+soleHolder.length+' Gate'+(soleHolder.length!==1?'s':'')+' Held Alone</div>';
    h+='<div style="font-size:13px;color:var(--deep);line-height:1.7;margin-bottom:10px">One spouse is functioning as the sole active Gatekeeper across '+soleHolder.length+' gate domain'+(soleHolder.length!==1?'s':'')+' ('+soleHolder.map(function(k){return gateNames[k];}).join(', ')+'). This is not simply a difference in spiritual maturity — it is a structural condition with specific consequences for the marriage, the children, and the generational legacy.</div>';

    h+='<div style="font-size:12px;font-weight:600;color:var(--warn);margin-bottom:6px;margin-top:12px">What this means for the marriage:</div>';
    h+='<div style="font-size:12px;color:var(--deep);line-height:1.7;margin-bottom:10px">A gate held by one spouse alone is structurally unstable — the moment that person\'s capacity is depleted, the gate falls with no redundancy. The functioning spouse accumulates spiritual loneliness: carrying covenant governance without a covenant partner. Over time, what began as faithfulness converts to resentment. The non-functioning spouse accumulates shame — and shame, when unnamed, becomes either withdrawal or resistance to the very governance they are not providing. The gap between them widens not because love decreases but because the structural inequality deepens without ever being named.</div>';

    h+='<div style="font-size:12px;font-weight:600;color:var(--warn);margin-bottom:6px">What this means for the children:</div>';
    h+='<div style="font-size:12px;color:var(--deep);line-height:1.7;margin-bottom:10px">Children do not inherit what their parents teach — they inherit what they observe being held, contested, or abandoned. With one parent governing these gates and the other absent from them, the children receive a split picture: one parent\'s framework is present and governing; the other\'s is absent or opposed. When children must choose between two competing frameworks, the non-functioning parent\'s is almost always easier to adopt because it requires nothing. This is one of the primary mechanisms by which faith, financial order, and covenant values fail to transmit to the next generation even in actively religious households. The most perceptive child frequently gets triangulated into the functioning parent\'s governance load — becoming a surrogate partner in carrying what the other spouse is not carrying. This child will develop either a Guarded attachment (the weight produces a child who stops letting people in) or a Wounded attachment (the burden of covering produces a child who expects to carry everything alone).</div>';

    h+='<div style="font-size:12px;font-weight:600;color:var(--warn);margin-bottom:6px">What this means for the generational legacy:</div>';
    h+='<div style="font-size:12px;color:var(--deep);line-height:1.7">Three legacy outcomes are possible from a one-spouse gate condition. First: the Interrupted Generation — the children who adopt the functioning parent\'s framework become the family\'s first generation to build a household where both spouses hold the gates together. But they will do so without a model for what the non-functioning parent\'s role looks like when it is also covenantally ordered, making them vulnerable to choosing a spouse who replicates the absent parent. Second: the Collapsed Inheritance — if the functioning spouse burns out, the children inherit a household where even demonstrated faithfulness failed, producing the deepest theological wound in the Ruin pattern: the belief that faithfulness is not enough. Third: the Divided Inheritance — the children split the parental models, one inhabiting each. These siblings often experience significant relational conflict in adulthood because they are replicating their parents\' structural inequality in their sibling relationship.</div>';
    h+='</div>';
  }

  // Contested gate analysis
  if(isCouple&&contested.length>0){
    h+='<div style="margin-top:12px;padding:12px 16px;background:#FFF0F0;border-left:3px solid #8B1A1A;border-radius:4px">';
    h+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#8B1A1A;margin-bottom:8px">Contested Gate Condition — '+contested.length+' Gate'+(contested.length!==1?'s':'')+' Under Internal Siege</div>';
    h+='<div style="font-size:12px;color:var(--deep);line-height:1.7">The contested gate is the most dangerous configuration because the threat is not from outside the wall — it is from inside the household. One spouse is attempting to hold the governance of these domains while the other actively undermines it. This is the pattern of inside collapse: Tobiah given a room in the temple (Nehemiah 13:4–5). The most severe spiritual and relational damage in a marriage occurs not when the enemy attacks from without but when the covenant partner becomes the agent of the gate\'s compromise. Children raised in a household with contested gates inherit a specific wound: they learn that covenant governance is a battleground, not a shared foundation. The Breach pattern\'s most sophisticated entry point in Christian households is always through a contested gate — using one spouse\'s resistance to undermine what the other is trying to establish, then reframing the resulting damage as evidence that the governance itself was wrong.</div>';
    h+='</div>';
  }

  // Neither-holding analysis
  if(isCouple&&neither.length>0){
    h+='<div style="margin-top:12px;padding:12px 16px;background:#F5F0FF;border-left:3px solid #4A2A7A;border-radius:4px">';
    h+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#4A2A7A;margin-bottom:8px">Ungoverned Gates — '+neither.length+' Domain'+(neither.length!==1?'s':'')+' With No Covering</div>';
    h+='<div style="font-size:12px;color:var(--deep);line-height:1.7">These gates are not broken — they are absent. No one is governing these domains. Ungoverned gates do not simply leave a household neutral — they leave it fully permeable. Whatever pattern is strongest in either family lineage, whatever cultural system is most actively pressing against the household, whatever creature has been operating in the generational background — all of it has full, uncontested access through these ungoverned thresholds. Children growing up in households with ungoverned gates do not learn that these domains are unimportant. They learn that these domains are ungovernable — that no one can be responsible for them, that expecting governance in these areas is unrealistic. This is one of the Foundation Crack pattern\'s most reliable transmission mechanisms: not through active dysfunction but through the quiet normalization of absence.</div>';
    h+='</div>';
  }

  // Governance principle
  h+='<div class="finding-row"><div class="finding-dot dot-gold"></div>';
  h+='<div><div class="finding-text">Governance principle: gates fell before walls</div>';
  h+='<div class="finding-sub">The gate assessment reveals where covenant governance failed first — before wall deterioration became visible. The wall assessment shows what structural damage followed from these gate failures.</div>';
  h+='</div></div>';
  h+='</div></div>';
  return h;
}
