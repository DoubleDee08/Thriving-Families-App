      standard:"Does your household have a functioning standard for engaging with its generational inheritance — whether that inheritance is faith-based (to be honored and built on) or dysfunctional (to be named, renounced where necessary, and replaced)? The standard is not about the heritage being clean — it is about having a deliberate, agreed framework for what to carry forward and what to set down.",
      sub:"Not whether the heritage is healthy, but whether the household has a deliberate, agreed framework for engaging with it.",
      intact:"The household has a named posture toward its generational inheritance — whether faith-based or dysfunctional. It knows what it honors, what it renounces, and what it is intentionally building differently. The Old Gate standard is met regardless of what was inherited, as long as the household has a deliberate framework for engaging with it.",
      breached:"The household has no deliberate relationship with its generational inheritance — whether faith-based or dysfunctional. A faith legacy is being received passively rather than honored intentionally. A dysfunctional heritage is running unchallenged into the present generation. Either way, the absence of a governing standard means the lineage determines the household's future by default.",
      creature:"The Foundation Crack transmits most efficiently through the Old Gate when there is no standard for what the lineage means and what should or should not be carried forward."
    },
    {
      key:"wall_transition",
      gate:"Valley Gate",
      domain:"Life Transition Management",
      standard:"Does your household have a standard for how it navigates major transitions — a framework for stewarding the threshold seasons rather than simply surviving them?",
      sub:"Marriage, children, loss, career change, relocation — does the household have an agreed way of approaching these seasons covenantally?",
      intact:"The household has a recognisable standard for transition — prayer, deliberate planning, covenant review, or community accountability — that both spouses engage.",
      breached:"Transitions happen to this household rather than being stewarded by it. There is no agreed framework for navigating threshold seasons together.",
      creature:"All three patterns enter through the Valley Gate. An unstewarded transition is the highest-exposure moment for pattern entry because the household's existing structure is in flux."
    },
    {
      key:"wall_repentance",
      gate:"Dung Gate",
      domain:"Repentance & Purging",
      standard:"Does your household have a functioning standard for repentance, confession, and the deliberate removal of what does not belong — a capacity to name sin and expel it?",
      sub:"Not whether the household is sinless, but whether it has an agreed mechanism for identifying, naming, and removing destructive patterns.",
      intact:"The household has a functioning repentance culture — sin can be named, accountability exists, and patterns can be confronted and removed.",
      breached:"The household has no functioning repentance culture. What is wrong stays because no one has the authority, safety, or framework to name and remove it.",
      creature:"The Breach thrives in a household that cannot name what is unclean. Accumulation of unnamed sin is the Ruin's most productive atmosphere."
    },
    {
      key:"wall_word",
      gate:"Water Gate",
      domain:"Scripture & Spiritual Nourishment",
      standard:"Does your household have Scripture functioning as a living, governing standard — not as a reference text but as the framework through which household decisions, values, and identity are interpreted?",
      sub:"Not whether the Bible is read, but whether the Word has governing authority in how this household understands itself and makes decisions.",
      intact:"Scripture functions as a governing framework — household decisions, conflicts, and values are interpreted through it. Both spouses recognise its authority.",
      breached:"Scripture may be present in the household but does not govern it. The Word is one voice among many rather than the constitutive framework.",
      creature:"The Breach fills the vacuum left by an absent governing Word — substituting distorted narratives for covenant truth. The Foundation Crack's ideological ceiling is always built from a non-biblical or sub-biblical framework."
    },
    {
      key:"wall_warfare",
      gate:"Horse Gate",
      domain:"Spiritual Warfare Posture",
      standard:"Does your household have an agreed standard for spiritual warfare — a framework that recognises spiritual attack, maintains an intercessory posture, and responds to threats ahead of visible crisis?",
      sub:"Not whether conflict is absent, but whether the household has a named, shared understanding of spiritual warfare and its role in household life.",
      intact:"The household has a functioning warfare standard — intercession is a practice, spiritual attack is named and engaged, and the household does not rely entirely on reactive response.",
      breached:"The household has no framework for spiritual warfare. Threats are not anticipated, intercession is absent or sporadic, and the household responds to crises only after they have arrived.",
      creature:"The Foundation Crack's generational assault proceeds uncontested through a household with no warfare standard. The Ruin deepens when no one is posted ahead of the grief."
    },
    {
      key:"wall_accountability",
      gate:"Miphkad Gate",
      domain:"Accountability Structures",
      standard:"Does your household have an agreed standard for accountability — a functioning structure for honest self-assessment, mutual review, and external accountability?",
      sub:"Not whether the household is functioning well, but whether it has an agreed mechanism for finding out honestly how it is functioning.",
      intact:"The household has a functioning accountability standard — regular honest assessment occurs, patterns are named, and external accountability exists.",
      breached:"The household has no functioning accountability structure. Patterns go unnamed, honest assessment does not occur, and no one outside the household has meaningful access to its actual condition.",
      creature:"The Breach operates most freely in a household that cannot self-examine. Every pattern — The Ruin, The Breach, The Foundation Crack — intensifies in the absence of accountability."
    }
  ];

  // ── Cross-reference gate data ─────────────────────────────────────────
  var gateKeyMap={
    wall_worship:"gate_sheep", wall_provision:"gate_fish", wall_heritage:"gate_old",
    wall_transition:"gate_valley", wall_repentance:"gate_dung", wall_word:"gate_water",
    wall_warfare:"gate_horse", wall_accountability:"gate_miphkad"
  };

  // ── Build the step ────────────────────────────────────────────────────
  var out='<div class="main">';
  out+='<div class="section-label">Step 8 of '+(STEPS.length-1)+' — Wall Assessment</div>';
  out+='<div class="section-title">Covenant Architecture — Is the Standard Still Standing?</div>';
  out+='<div class="section-desc">The Gate Assessment showed who is governing each domain. This assessment asks a different question: is the standard itself still structurally intact? A Gatekeeper with no wall to hang the gate on cannot govern. A standard without a Gatekeeper cannot hold. Both must be assessed separately.</div>';

  if(!isClientMode()){
  out+='<div style="background:var(--light-blue);border:1px solid var(--border);border-left:4px solid var(--mid);border-radius:4px;padding:12px 16px;margin-bottom:20px;font-size:12px;color:var(--deep);line-height:1.6">';
  out+='<strong>How to read this assessment alongside the Gate Assessment:</strong><br>';
  out+='Gate destroyed + Wall intact = governance work needed — the standard exists but no one is enforcing it.<br>';
  out+='Gate held + Wall breached = identity and standard work needed — someone is at the gate but has nothing to hang it on.<br>';
  out+='Both intact = protected — the domain has both structure and governance.<br>';
  out+='Both breached = highest vulnerability — the pattern has full access through this domain.';
  out+='</div>';
  }

  walls.forEach(function(wall){
    var cur=d[wall.key]||null;
    var lvl=cur?parseInt(cur):null;
    var gateKey=gateKeyMap[wall.key];
    var gateScore=d[gateKey]?parseInt(d[gateKey]):null;
    var gateHolder=d[gateKey+'_holder'];

    // Cross-reference flag
    var crossRef="";
    var crossColor="var(--mid)";
    if(lvl&&gateScore){
      var wallBreached=lvl>=3; var gateBreached=gateScore<=2||gateScore===3;
      if(!wallBreached&&gateBreached){
        crossRef="Standard intact but gate compromised — governance work is the priority here. The standard exists; restoration requires assigning and empowering a Gatekeeper.";
        crossColor="#4A7FB5";
      } else if(wallBreached&&!gateBreached){
        crossRef="Gate held but standard breached — identity and standard work is the priority. Someone is standing at the gate but the covenant architecture behind them needs rebuilding first.";
        crossColor="var(--warn)";
      } else if(wallBreached&&gateBreached){
        crossRef="Both the standard and the governance are compromised — this domain is fully exposed. All three patterns have access here.";
        crossColor="#8B1A1A";
      } else if(!wallBreached&&!gateBreached){
        crossRef="Both standard and governance intact — this domain is protected. Maintain under pressure.";
        crossColor="#4A8A4A";
      }
    }

    out+='<div class="question-card" style="margin-bottom:14px">';
    out+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    out+='<div style="background:var(--mid);color:#fff;border-radius:3px;padding:3px 8px;font-size:10px;font-weight:600;letter-spacing:0.5px">'+wall.gate+'</div>';
    out+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">'+wall.domain+'</div>';
    if(gateScore&&!isClientMode()){
      var gc=gateScore<=2?'var(--warn)':gateScore===3?'#B8860B':'#4A8A4A';
      out+='<div style="font-size:10px;color:'+gc+';margin-left:auto;font-weight:600">Gate: '+gateScore+'/5'+(gateHolder?' · '+(gateHolder==='both'?'Shared':gateHolder==='neither'?'Ungoverned':gateHolder==='contested'?'Contested':'Sole holder'):'')+'</div>';
    }
    out+='</div>';
    out+='<div style="font-family:Cormorant Garamond,serif;font-size:15px;font-weight:600;color:var(--deep);line-height:1.4;margin-bottom:8px">'+wall.standard+'</div>';
    out+='<div style="font-size:11px;color:var(--muted);margin-bottom:12px;font-style:italic;line-height:1.5">'+wall.sub+'</div>';

    out+='<div class="scale-row">';
    out+='<div class="scale-label" style="min-width:50px;font-size:11px">Intact</div>';
    out+='<div class="scale-btns">';
    for(var n=1;n<=5;n++){
      out+='<button class="scale-btn '+(cur==n?"selected":"")+ '" data-scale-key="'+wall.key+'" data-scale-val="'+n+'" onclick="save(\''+wall.key+'\','+n+');renderStep()">'+n+'</button>';
    }
    out+='</div>';
    out+='<div class="scale-label right" style="min-width:70px;font-size:11px">Severely breached</div>';
    out+='</div>';

    // Condition feedback
    if(lvl&&!isClientMode()){
      out+='<div style="margin-top:8px;font-size:11px;line-height:1.5;padding:6px 10px;border-radius:3px;background:var(--offwhite,#F5F5F5)">';
      if(lvl<=2)out+='<span style="color:#4A8A4A;font-weight:600">Standard intact:</span> <span style="color:var(--muted)">'+wall.intact+'</span>';
      else if(lvl===3)out+='<span style="color:#B8860B;font-weight:600">Standard partial:</span> <span style="color:var(--muted)">Inconsistent — the standard exists in some form but has been significantly eroded or is contested within the household.</span>';
      else out+='<span style="color:var(--warn);font-weight:600">Standard breached:</span> <span style="color:var(--muted)">'+wall.breached+'</span>';
      out+='</div>';
    }

    // Cross-reference with gate
    if(crossRef&&!isClientMode()){
      out+='<div style="margin-top:8px;padding:6px 10px;border-left:3px solid '+crossColor+';background:var(--cream);border-radius:3px;font-size:11px;color:var(--deep);line-height:1.5">'+crossRef+'</div>';
    }

    // Creature note for breached walls
    if(lvl&&lvl>=3&&!isClientMode()){
      out+='<div style="margin-top:6px;font-size:11px;color:var(--muted);font-style:italic">'+wall.creature+'</div>';
    }

    out+='</div>';
  });

  // Wall summary
  var allWalls=['wall_worship','wall_provision','wall_heritage','wall_transition','wall_repentance','wall_word','wall_warfare','wall_accountability'];
  var scored=allWalls.filter(function(k){return d[k];});
  if(scored.length>=4&&!isClientMode()){
    var intact=scored.filter(function(k){return parseInt(d[k])<=2;});
    var partial=scored.filter(function(k){return parseInt(d[k])===3;});
    var breached=scored.filter(function(k){return parseInt(d[k])>=4;});
    var wallNames={wall_worship:'Sheep Gate',wall_provision:'Fish Gate',wall_heritage:'Old Gate',wall_transition:'Valley Gate',wall_repentance:'Dung Gate',wall_word:'Water Gate',wall_warfare:'Horse Gate',wall_accountability:'Miphkad Gate'};

    // Cross-reference analysis
    var standardIntactGateFailed=[], standardBreachedGateHeld=[], bothBreached=[], bothIntact=[];
    allWalls.forEach(function(wk){
      if(!d[wk])return;
      var gk=gateKeyMap[wk];
      if(!d[gk])return;
      var ws=parseInt(d[wk]); var gs=parseInt(d[gk]);
      var wb=ws>=3; var gb=gs<=3;
      if(!wb&&gb) standardIntactGateFailed.push(wallNames[wk]);
      else if(wb&&!gb) standardBreachedGateHeld.push(wallNames[wk]);
      else if(wb&&gb) bothBreached.push(wallNames[wk]);
      else if(!wb&&!gb) bothIntact.push(wallNames[wk]);
    });

    out+='<div style="background:var(--cream);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:4px;padding:16px 18px;margin-top:8px">';
    out+='<div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:12px">Wall Assessment Summary — '+scored.length+' of 8 Walls Assessed</div>';

    if(bothIntact.length>0){
      out+='<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#4A8A4A;margin-bottom:3px">Fully protected (standard + governance intact): '+bothIntact.join(' · ')+'</div></div>';
    }
    if(standardIntactGateFailed.length>0){
      out+='<div style="margin-bottom:8px;padding:8px 12px;background:#EEF0FA;border-radius:3px">';
      out+='<div style="font-size:11px;font-weight:600;color:var(--mid);margin-bottom:3px">Standard intact, gate compromised — governance work needed: '+standardIntactGateFailed.join(' · ')+'</div>';
      out+='<div style="font-size:11px;color:var(--muted)">The covenant architecture exists in these domains. The restoration pathway is assigning and empowering a Gatekeeper — not rebuilding the standard from scratch.</div>';
      out+='</div>';
    }
    if(standardBreachedGateHeld.length>0){
      out+='<div style="margin-bottom:8px;padding:8px 12px;background:#FDF3F0;border-radius:3px">';
      out+='<div style="font-size:11px;font-weight:600;color:var(--warn);margin-bottom:3px">Gate held, standard breached — identity and standard work needed: '+standardBreachedGateHeld.join(' · ')+'</div>';
      out+='<div style="font-size:11px;color:var(--muted)">Someone is at the gate but has no wall to hang it on. The Gatekeeper is working without a standard. Rebuilding the covenant architecture in these domains must come before governance can be effective.</div>';
      out+='</div>';
    }
    if(bothBreached.length>0){
      out+='<div style="margin-bottom:8px;padding:8px 12px;background:#FFF0F0;border-radius:3px">';
      out+='<div style="font-size:11px;font-weight:600;color:#8B1A1A;margin-bottom:3px">Both standard and governance breached — highest vulnerability: '+bothBreached.join(' · ')+'</div>';
      out+='<div style="font-size:11px;color:var(--muted)">These domains are fully exposed. All three patterns have uncontested access. Both standard rebuilding and governance assignment are required — simultaneously, not sequentially.</div>';
      out+='</div>';
    }
    out+='</div>';
  }

  out+=navRow(true);
  out+='</div>';
  return out;
}


function renderValley(){return`<div class="main"><div class="section-label">Step 8 of ${STEPS.length-1} — Valley Season</div><div class="section-title">Current Valley Season</div><div class="section-desc">Which valley terrain is this family currently navigating?</div>${optionQuestion("Which valley season best describes this family's current terrain?","valley_season",[{val:"valley_gate",label:"Valley Gate — A major threshold or transition"},{val:"valley_elah",label:"Valley of Elah — A direct challenge to identity, authority, or spiritual foundation"},{val:"valley_sin",label:"Wilderness of Sin — Sustained provision crisis or prolonged uncertainty"},{val:"valley_rephidim",label:"Valley of Rephidim — Active spiritual warfare under conditions of depletion"},{val:"multiple",label:"Multiple valleys simultaneously active"}],"",1)}${optionQuestion("How long has this valley season been active?","valley_duration",[{val:"acute",label:"Acute — weeks or months"},{val:"sustained",label:"Sustained — 1–3 years"},{val:"chronic",label:"Chronic — 3+ years"},{val:"generational",label:"Generational — predates this couple"}])}${optionQuestion("Has the family named this valley?","valley_named",[{val:"yes",label:"Yes — they understand the season they are in"},{val:"partial",label:"Partial — they sense something but lack language"},{val:"no",label:"No — navigating without any framework"}])}${navRow(!!state.data.valley_season)}</div>`}
function renderBowen(){return`<div class="main"><div class="section-label">Step 9 of ${STEPS.length-1} — Bowen Family Systems</div><div class="section-title">Bowen Dynamic Assessment</div><div class="section-desc">Murray Bowen's concepts mapped to the SJD framework — identifying the systemic mechanisms through which creatures travel across generations.</div>${getDifferentiationHTML()}${optionQuestion("Is triangulation active in this system?","bowen_triangulation",[{val:"yes",label:"Yes — a third party is stabilizing two-person anxiety"},{val:"suspected",label:"Suspected"},{val:"no",label:"No clear evidence"}],"A child, substance, or outside relationship being used to reduce marital anxiety.")}${optionQuestion("Is emotional cutoff present?","bowen_cutoff",[{val:"yes",label:"Yes — significant distance from one or both families of origin"},{val:"partial",label:"Partial — selective contact with managed distance"},{val:"no",label:"No — family connections maintained and worked through"}],"Distancing from family of origin to manage anxiety.")}${optionQuestion("Is the family projection process active?","bowen_projection",[{val:"yes",label:"Yes — a child is carrying the parental anxiety"},{val:"suspected",label:"Suspected"},{val:"no",label:"No evidence"}],"Parental anxiety being managed through focus on a specific child.")}${optionQuestion("Are sibling position dynamics contributing to the presenting issue?","bowen_sibling",[{val:"yes",label:"Yes — birth order roles reinforcing creature patterns"},{val:"suspected",label:"Possibly"},{val:"no",label:"Not a primary factor"}])}${navRow(!!(state.data.bowen_differentiation||state.data.h_bowen_diff||state.data.w_bowen_diff))}</div>`}

function renderAttachment(){
  const d=state.data;
  const pop=d.population;
  const profile=getFamilyAttachmentProfile();
  const attachOpts=[
    {val:"rooted",label:"Rooted — the relationship feels like a safe place; both people can be honest and present"},
    {val:"guarded",label:"Guarded — one or both manage the relationship carefully; real feelings stay below the surface"},
    {val:"wounded",label:"Wounded — the relationship is shaped by past losses; there is love but also a constant low-level fear of losing it"},
    {val:"untethered",label:"Untethered — the relationship feels unstable or unpredictable; hard to find consistent ground together"}
  ];
  return`<div class="main">
    <div class="section-label">Step 10 of ${STEPS.length-1} — Attachment Dynamics</div>
    <div class="section-title">Attachment Patterns & Family Profile</div>
    <div class="section-desc">Attachment is how a person learned to do relationship — shaped in the family of origin and carried into every relationship that follows. These questions build the household attachment profile.</div>

    ${optionQuestion("How would you describe the overall relational dynamic between the couple or within the household?","couple_attachment",attachOpts,"The pattern that feels most true — even if it is uncomfortable to name.",1)}

    <div class="question-card gold-card">
      <div class="q-label">Attachment Interaction Pattern</div>
      <div class="q-text">Which combination best describes the couple dynamic?</div>
      <div class="options-col">
        ${[
          {val:"rooted_rooted",label:"Both rooted — secure foundation; protective against creature entry"},
          {val:"guarded_wounded",label:"One guarded, one wounded — the guarded person's distance confirms the wounded person's fear of loss. The most common SJD-enabling pairing."},
          {val:"guarded_guarded",label:"Both guarded — a household of managed connection; neither person is fully known"},
          {val:"wounded_wounded",label:"Both wounded — deep bond through shared pain, but no structural stability to build on"},
          {val:"untethered_any",label:"One or both untethered — generational chaos is the relational floor; no stable blueprint"},
          {val:"mixed",label:"Mixed or unclear — patterns shift under stress"}
        ].map(o=>`<button class="option-btn ${d.couple_attachment_pattern===o.val?"selected":""}" onclick="save('couple_attachment_pattern','${o.val}');renderStep()">${o.label}</button>`).join("")}
      </div>
    </div>

    ${profile.members.length>0&&!isClientMode()?`<div class="question-card" style="border-left-color:var(--gold)">
      <div class="q-label">Current Household Attachment Summary</div>
      <div class="q-text">Family Attachment Profile</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        ${profile.members.map(m=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--light-blue);border-radius:4px">
          <div style="font-size:12px;font-weight:600;color:var(--deep);min-width:60px">${m.label}</div>
          <div style="font-size:12px;color:var(--mid);font-weight:500">${getAttachmentLabel(m.val)}</div>
          <div style="font-size:11px;color:var(--muted);flex:1">${getAttachmentSJD(m.val).split("—")[0]}</div>
        </div>`).join("")}
      </div>
      <div style="margin-top:12px;padding:10px 14px;background:var(--cream);border-left:3px solid var(--gold);border-radius:3px">
        <div style="font-size:11px;font-weight:600;color:var(--gold);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase">Family Attachment Narrative</div>
        <div style="font-size:13px;color:var(--deep);line-height:1.6">${profile.narrative}</div>
      </div>
    </div>`:""}

    ${navRow(true)}
  </div>`;
}

function renderGovernance(){
  const d=state.data;
  const profile=getGovernanceProfile();
  const scaleQ=(label,key,sub)=>{
    const cur=d[key]||null;
    return`<div class="question-card gold-card">
      <div class="q-label">${label}</div>
      ${sub?`<div class="q-sub">${sub}</div>`:""}
      <div class="scale-row">
        <div class="scale-label">Absent</div>
        <div class="scale-btns">${[1,2,3,4,5].map(n=>`<button class="scale-btn ${cur==n?"selected":""}" onclick="save('${key}',${n});renderStep()">${n}</button>`).join("")}</div>
        <div class="scale-label right">Fully Active</div>
      </div>
    </div>`;
  };
  const roleQ=(label,key,desc)=>{
    const cur=d[key]||null;
    return`<div class="question-card" style="border-left-color:var(--gold)">
      <div class="q-text">${label}</div>
      <div class="q-sub">${desc}</div>
      <div class="options-grid">
        <button class="option-btn ${cur==="yes"?"selected":""}" onclick="save('${key}','yes');renderStep()">Yes — this role is being filled</button>
        <button class="option-btn ${cur==="partial"?"selected":""}" onclick="save('${key}','partial');renderStep()">Partial — present but not functioning fully</button>
        <button class="option-btn ${cur==="no"?"selected":""}" onclick="save('${key}','no');renderStep()">No — this role is vacant</button>
        <button class="option-btn ${cur==="unknown"?"selected":""}" onclick="save('${key}','unknown');renderStep()">Unknown — has never been considered</button>
      </div>
    </div>`;
  };
  return`<div class="main">
    <div class="section-label">Step 11 of ${STEPS.length-1} — Governance Assessment</div>
    <div class="section-title">Perimeter Governance — The Three Roles</div>
    <div class="section-desc">A wall and a gate require people to govern them. These questions assess whether the three governance roles are being filled in this household — and which of the five governance activities are active or absent.</div>

    <div style="background:var(--cream);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:4px;padding:14px 16px;margin-bottom:20px">
      <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px">Framework Note</div>
      <div style="font-size:12px;color:var(--deep);line-height:1.6">Every family needs three governance roles at its perimeter: a <strong>Gatekeeper</strong> (who governs what enters), a <strong>Watchman</strong> (who watches and prays ahead of threats), and a <strong>Master of the Hinge</strong> (who knows when to open and when to close). Vacant roles are always filled by something — often by the creature.</div>
    </div>

    ${roleQ("Is there a functioning Gatekeeper in this household?","gatekeeper_present","Someone with the acknowledged authority, knowledge, and spiritual standing to govern what enters this family — spiritually, relationally, and culturally.")}
    ${roleQ("Is there a functioning Watchman in this household?","watchman_present","Someone who watches in prayer, names patterns before they become crises, and intercedes ahead of approaching threats. This may be one person or a prayer community.")}
    ${roleQ("Is there a functioning Master of the Hinge?","hinge_present","Does this household know how to open wide when relationship and abundance require it — and close firmly when threat or defilement approaches? Or is the gate stuck in one position?")}

    <div class="section-title" style="font-size:18px;margin-top:24px;margin-bottom:8px">The Five Governance Activities</div>
    <div class="section-desc" style="margin-bottom:16px">Rate how actively each governance activity is practiced in this household.</div>

    ${scaleQ("Ritual Purification & Sanctification","gov_purify","Regular practices of consecration, confession, covenant renewal — keeping the threshold clean")}
    ${scaleQ("Liturgy of Inquiry — Vetting & Discernment","gov_inquiry","The practice of questioning what enters: relationships, influences, values, cultural input")}
    ${scaleQ("Watchfulness & Prophetic Intercession","gov_watch","Praying ahead of visible crisis; naming patterns before they arrive; interceding for the household")}
    ${scaleQ("Proclamation of Truth & Blessing","gov_proclaim","Explicitly declaring God's word over the household; speaking blessing and identity over each member")}
    ${scaleQ("High Praise & Sacred Ushering","gov_praise","Corporate, genuine, joy-sourced worship that covers the household — not performance, but praise")}

    ${profile.vacancies.length>0||profile.activities.length>0?`<div style="background:var(--light-blue);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:4px;padding:14px 16px;margin-top:16px">
      <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--warn);margin-bottom:8px">Governance Vacancies Detected — ${profile.vacancies.length} Role${profile.vacancies.length!==1?"s":""}, ${profile.activities.length} Activit${profile.activities.length!==1?"ies":"y"}</div>
      ${profile.vacancies.map(v=>`<div style="font-size:12px;color:var(--deep);padding:4px 0;border-bottom:1px solid var(--border)"><strong>${v.role} vacant</strong> → ${v.breach}</div>`).join("")}
      ${profile.activities.map(a=>`<div style="font-size:12px;color:var(--deep);padding:4px 0;border-bottom:1px solid var(--border)"><strong>${a.name}</strong> weak → ${a.effect}</div>`).join("")}
    </div>`:""}

    ${navRow(true)}
  </div>`;
}
function getLineageAnalysis(){
  var d=state.data;
  var pop=d.population;
  var isCouple=(pop==="couple"||pop==="family");

  // ── Pull data from genogram steps ───────────────────────────────────
  // From Family Structure (Step 3)
  var hFather=d.h_father||null;
  var hMother=d.h_mother||null;
  var hTrauma=d.h_trauma||null;
  var hFaith=d.h_faith||null;
  var wFather=d.w_father||null;
  var wMother=d.w_mother||null;
  var wTrauma=d.w_trauma||null;
  var wFaith=d.w_faith||null;
  var hAttach=d.h_attachment||null;
  var wAttach=d.w_attachment||null;

  // From Foundation Crack (Step 6)
  var hGen=d.h_pattern_generations||d.pattern_generations||null;
  var wGen=d.w_pattern_generations||d.pattern_generations||null;
  var hCulture=d.h_family_culture||null;
  var wCulture=d.w_family_culture||null;

  // From SJD scores
  var scores=computeScores();
  var ranked=getPrimary(scores);
  var primary=ranked[0].name;
  var secondary=ranked[1].name;

  var fatherLabels={present_close:"present and close",present_distant:"present but distant",absent_known:"absent (known)",absent_unknown:"absent (unknown)",deceased:"deceased"};
  var traumaLabels={none_known:"none known",addiction:"addiction",abuse:"abuse",abandonment:"abandonment",poverty:"generational poverty",loss:"multiple losses",multiple:"multiple trauma categories"};
  var faithLabels={christian:"Christian household",nominally:"nominally Christian",other_faith:"other faith tradition",secular:"secular household"};
  var cultureLabels={covenant:"Covenant order",functional:"Functional, no covenant architecture",survival:"Survival-organized",chaos:"Chaos as the norm"};
  var genLabels={current:"this generation only",two_gen:"2 generations","2gen":"2 generations","3plus":"3+ generations",unknown:"unknown lineage depth"};
  var attachLabels={rooted:"Rooted",guarded:"Guarded",wounded:"Wounded",untethered:"Untethered"};

  // ── Build the analysis ───────────────────────────────────────────────
  var findings=[];
  var warnings=[];
  var config="";

  // Father relationship analysis
  if(hFather){
    var hFatherAbsent=hFather==="absent_known"||hFather==="absent_unknown"||hFather==="deceased";
    var wFatherAbsent=wFather&&(wFather==="absent_known"||wFather==="absent_unknown"||wFather==="deceased");
    if(hFatherAbsent&&wFatherAbsent){
      warnings.push("Both lineages carry paternal absence — a double fatherlessness configuration. The household has no internalized model of present, governing fatherhood from either lineage. The Gatekeeper role has no generational template to draw from in either family of origin.");
      config="Dual fatherless lineage";
    } else if(hFatherAbsent){
      warnings.push("Him: paternal absence in lineage ("+fatherLabels[hFather]+"). The male covenant governance role has no internalized generational model. He is building a fatherhood he has not seen.");
    } else if(wFatherAbsent&&wFather){
      warnings.push("Her: paternal absence in lineage ("+fatherLabels[wFather]+"). The female experience of male covenant governance is formed by absence rather than presence. This shapes her expectations of the Gatekeeper role in this household.");
    }
  }

  // Trauma configuration
  if(hTrauma&&wTrauma){
    var bothTrauma=hTrauma!=="none_known"&&wTrauma!=="none_known";
    var sameTrauma=hTrauma===wTrauma;
    if(bothTrauma&&sameTrauma){
      warnings.push("Both lineages carry the same trauma category ("+traumaLabels[hTrauma]+"). Shared trauma background creates both resonance (mutual understanding) and amplification (the household has double exposure to the same pattern without a counterweight from either lineage).");
    } else if(bothTrauma){
      findings.push("Dual trauma lineages: His — "+traumaLabels[hTrauma]+" · Hers — "+traumaLabels[wTrauma]+". Different trauma histories produce different survival strategies that may conflict under household pressure.");
    }
  } else if(hTrauma&&hTrauma!=="none_known"){
    findings.push("His lineage carries: "+traumaLabels[hTrauma]+". Hers is clear or not assessed.");
  } else if(wTrauma&&wTrauma!=="none_known"){
    findings.push("Her lineage carries: "+traumaLabels[wTrauma]+". His is clear or not assessed.");
  }

  // Faith lineage
  if(hFaith&&wFaith){
    if(hFaith===wFaith){
      findings.push("Shared faith background: both from "+faithLabels[hFaith]+" households. Common framework, but shared nominalism is not the same as shared covenant.");
    } else {
      var hStrong=(hFaith==="christian"); var wStrong=(wFaith==="christian");
      if(hStrong!==wStrong){
        warnings.push("Faith lineage divergence: His household was "+faithLabels[hFaith]+" · Hers was "+faithLabels[wFaith]+". Different inherited relationships to God and faith practice. The Sheep Gate and Water Gate governance will reflect this divergence.");
      } else {
        findings.push("Faith backgrounds differ: His — "+faithLabels[hFaith]+" · Hers — "+faithLabels[wFaith]+".");
      }
    }
  }

  // Generational pattern depth
  if(hGen&&wGen){
    var genDepth={current:1,"2gen":2,two_gen:2,"3plus":3,unknown:0};
    var hDepth=genDepth[hGen]||0; var wDepth=genDepth[wGen]||0;
    if(hDepth>0&&wDepth>0){
      if(Math.abs(hDepth-wDepth)>=2){
        var deeper=hDepth>wDepth?"His":"Her";
        var shallower=hDepth>wDepth?"Her":"His";
        warnings.push(deeper+" lineage carries the pattern "+genLabels[hDepth>wDepth?hGen:wGen]+" back · "+shallower+" is "+genLabels[hDepth>wDepth?wGen:hGen]+". The "+deeper.toLowerCase()+" lineage is bringing a significantly deeper dragon into this household. The "+shallower.toLowerCase()+" lineage may not yet recognize the depth of what they have married into.");
      } else if(hGen==="3plus"&&wGen==="3plus"){
        warnings.push("Both lineages carry 3+ generational patterns. This is a double dragon configuration. The Foundation Crack pattern in this household has generational weight from both sides of the covenant.");
      }
    }
  }

  // Governing culture collision
  if(hCulture&&wCulture&&hCulture!==wCulture){
    var cultureOrder=["covenant","functional","survival","chaos"];
    var hRank=cultureOrder.indexOf(hCulture); var wRank=cultureOrder.indexOf(wCulture);
    if(Math.abs(hRank-wRank)>=2){
      warnings.push("Significant governing culture collision: His family of origin was "+cultureLabels[hCulture]+" · Hers was "+cultureLabels[wCulture]+". What one spouse considers normal family function, the other may experience as either suffocating order or alarming chaos. The household's baseline definition of 'how a family works' is contested from the foundation.");
    } else {
      findings.push("Governing culture difference: His family of origin — "+cultureLabels[hCulture]+" · Hers — "+cultureLabels[wCulture]+".");
    }
  }

  // Attachment configuration
  if(hAttach&&wAttach){
    var attachConf=hAttach+"_"+wAttach;
    var attachNotes={
      "rooted_rooted":"Both Rooted — the household has a secure relational foundation. Strong protective factor against creature entry through relational channels.",
      "guarded_wounded":"Guarded + Wounded — the most common SJD-enabling configuration. The guarded spouse's emotional distance confirms the wounded spouse's expectation of loss. The guarded spouse's withdrawal feels like abandonment to the wounded spouse; the wounded spouse's emotional intensity feels like engulfment to the guarded spouse.",
      "wounded_guarded":"Wounded + Guarded — same configuration as above, reversed.",
      "guarded_guarded":"Both Guarded — a household of managed connection. Neither person is fully known. The Breach pattern operates through performance and hidden truth in every relational exchange.",
      "wounded_wounded":"Both Wounded — deep bond through shared pain, but no stable relational structure to build on. The Ruin inhabits the shared desolation.",
      "untethered_untethered":"Both Untethered — generational chaos is the relational floor in both lineages. The household has no internalized blueprint for what stable relationship looks like from either side.",
      "untethered_wounded":"Untethered + Wounded — generational chaos meeting personal grief. The Foundation Crack and the Ruin are operating in tandem.",
      "wounded_untethered":"Untethered + Wounded — same configuration, reversed.",
      "rooted_guarded":"Rooted + Guarded — the rooted spouse's security may feel threatening to the guarded spouse. The guarded spouse may interpret the rooted spouse's openness as naivety and the rooted spouse may interpret the guarded spouse's management as rejection.",
      "guarded_rooted":"Rooted + Guarded — same, reversed.",
      "rooted_wounded":"Rooted + Wounded — the rooted spouse's security is a genuine resource, but the wounded spouse may test it repeatedly to confirm it is real. Patience and consistency from the rooted spouse is the primary therapeutic factor.",
      "wounded_rooted":"Rooted + Wounded — same, reversed."
    };
    var attachNote=attachNotes[attachConf]||("Attachment configuration: "+attachLabels[hAttach]+" (Him) and "+attachLabels[wAttach]+" (Her). Assess the interaction pattern under stress.");
    findings.push(attachNote);
  }

  // ── Lineage configuration label ──────────────────────────────────────
  // Derive automatically from the data
  var samePattern=(hGen&&wGen&&hGen===wGen);
  var bothHealed=false; // assessed through restoration data if available
  var oneHealed=(hAttach==="rooted"&&(wAttach==="wounded"||wAttach==="guarded"||wAttach==="untethered"))||
                (wAttach==="rooted"&&(hAttach==="wounded"||hAttach==="guarded"||hAttach==="untethered"));
  var configLabel="";
  if(hAttach==="rooted"&&wAttach==="rooted") configLabel="Both Carry Rooted Attachment — Covenant Foundation Strong";
  else if(oneHealed) configLabel="One Rooted, One Creature-Linked Attachment — Asymmetric Foundation";
  else if(hTrauma&&wTrauma&&hTrauma!==wTrauma&&hTrauma!=="none_known"&&wTrauma!=="none_known") configLabel="Dual Trauma Lineages — Different Creature Histories";
  else if(hTrauma&&wTrauma&&hTrauma===wTrauma&&hTrauma!=="none_known") configLabel="Same Creature Lineage in Both Histories";
  else configLabel="Lineage Configuration — Partial Data";

  return {findings:findings, warnings:warnings, configLabel:configLabel, scores:scores, ranked:ranked, primary:primary, secondary:secondary};
}

  ];

  var sel=d.hunter_patterns||[];

  var h='<div class="main">';
  h+='<div class="section-label">Step 15 of '+(STEPS.length-1)+'</div>';
  h+='<div class="section-title">Hunter Intelligence — Family Operating System</div>';
  h+='<div class="section-desc">Every family runs on some unspoken rules and repeating patterns — things nobody decided on purpose, but that keep showing up anyway. This section asks about those patterns in your own family. There\'s no wrong answer; the goal is just to notice what\'s actually there.</div>';

  // ── Pattern Tracking ─────────────────────────────────────────────
  h+='<div class="question-card">';
  h+='<div class="q-text">Which of these recurring patterns are present in this family\'s history?</div>';
  h+='<div class="q-sub">Select all that apply across the family line — not just the current household. Patterns that appear in multiple generations carry significantly more diagnostic weight.</div>';

    h+=o.l+'</button>';
  });
  h+='</div>';
  if(sel.length>0){

  }
  h+='</div>';

  // ── Governing Narratives ─────────────────────────────────────────
  h+='<div class="question-card">';

  // ── Governing System Classification ─────────────────────────────
  h+='<div class="question-card gold-card">';
  h+='<div class="q-label">What best describes this family\'s primary governing system?</div>';
  h+='<div class="q-sub">This is the organising principle that most shapes how this family makes decisions, assigns roles, and defines belonging.</div>';
  var govSystems=[
    {v:"performance",l:"Performance — belonging is earned through achievement, appearance, or compliance"},
    {v:"survival",l:"Survival — every decision is driven by threat management and resource scarcity"},
    {v:"control",l:"Control — safety is maintained through dominance, information management, or fear"},
    {v:"avoidance",l:"Avoidance — conflict, truth, and vulnerability are systematically avoided"},
    {v:"enmeshment",l:"Enmeshment — individual identity is sacrificed for family cohesion"},
    {v:"abandonment",l:"Abandonment — chronic absence or inconsistency is the relational norm"},
    {v:"covenant",l:"Covenant — the family operates from a framework of mutual commitment and accountability"},
  ];
  var curGov=d.hunter_governing_system||null;

    h+='<button class="option-btn '+(curGov===o.v?"selected":"")+'" onclick="save(\'hunter_governing_system\',\''+o.v+'\');renderStep()" style="font-size:12px;text-align:left">'+o.l+'</button>';
  });
  h+='</div>';
  h+='</div>';

  h+=navRow(!!(sel.length>0||d.hunter_governing_system));
  h+='</div>';
  return h;
}

  // Mindset profile
  out+='<div class="question-card" style="border-left-color:var(--warn);margin-top:16px">';
  out+='<div class="q-label" style="color:var(--warn)">Egyptian Mindset Profile</div>';
  out+='<div class="q-text">Which mindsets are currently governing this family\'s thinking and decision-making?</div>';
  out+='<div class="q-sub">These are the belief systems that make the current operating system feel rational, necessary, or simply inevitable. Select all that are genuinely active.</div>';

  var mindsetOpts=[
    {v:"scarcity",l:"Scarcity mindset — there is never enough; provision is always at risk; generosity feels dangerous"},
    {v:"fear",l:"Fear mindset — threat is assumed; safety requires constant vigilance; trust is a liability"},
    {v:"performance",l:"Performance mindset — value is earned through output; rest is a luxury; failure is identity"},
    {v:"dependency",l:"Dependency mindset — someone else must provide the answer, the rescue, or the permission"},
    {v:"control",l:"Control mindset — the only safety is what can be managed; vulnerability must be prevented"},
    {v:"survival",l:"Survival mindset — the goal is to get through, not to build; vision requires margin that doesn't exist"},
    {v:"shame",l:"Shame mindset — the fundamental belief is that something is wrong with me/us that cannot be fixed"},
    {v:"entitlement",l:"Entitlement mindset — the operating system has produced a debt that others owe; restoration means repayment"},
    {v:"fatalism",l:"Fatalism mindset — this is how things are and always will be; change is for other families, not this one"}
  ];

  var selMind=d.egypt_mindsets||[];
  out+='<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">';
  mindsetOpts.forEach(function(o){
    var s=selMind.includes(o.v);
    out+='<button class="option-btn '+(s?"selected":"")+'" data-egypt-mindset="'+o.v+'" style="display:flex;align-items:center;gap:8px;text-align:left;font-size:12px">';
    out+='<span style="width:16px;height:16px;border:2px solid '+(s?"var(--white)":"var(--warn)")+';border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;pointer-events:none">'+(s?"✓":"")+"</span>";
    out+=o.l+"</button>";
  });
  out+="</div>";

  // Mindset combinations
  var mindFlags=[];
  if(selMind.includes("scarcity")&&selMind.includes("control"))
    mindFlags.push({t:"Scarcity and control together — the scarcity experience produces the control response. The harder the family tries to control their environment, the less margin they have for genuine restoration. The very strategy for managing the problem is preventing the solution.",c:"The Wilderness of Sin pattern: Israel's scarcity produced complaint, which produced the demand for control over their own provision, which produced the golden calf."});
  if(selMind.includes("shame")&&selMind.includes("performance"))
    mindFlags.push({t:"Shame and performance together — the shame drives the performance and the performance temporarily covers the shame. Neither is addressed by the other. The cycle is self-sustaining and exhausting.",c:"The Breach pattern's fullest expression: identity is not received, it is achieved — and achievement is never enough to silence the shame."});
  if(selMind.includes("fatalism")&&selMind.includes("dependency"))
    mindFlags.push({t:"Fatalism and dependency together — the family has concluded that nothing can change AND that someone else must change it. This is the slave psychology Exodus describes in Israel: they cried out to God for rescue while simultaneously insisting that change was impossible.",c:"This is the hardest restoration environment. The counselor must address the fatalistic narrative before any tools or frameworks can be received."});
  if(selMind.includes("fear")&&selMind.includes("survival"))
    mindFlags.push({t:"Fear and survival together — the system is running on threat-detection. Everything is processed through the question 'is this safe?' There is no cognitive bandwidth for vision, covenant, or long-term building.",c:"The Valley of Rephidim pattern: the family is in battle and depleted simultaneously. They can survive the crisis but they cannot build the future while the crisis is the only reality."});
  if(selMind.includes("entitlement")&&selMind.includes("dependency"))
    mindFlags.push({t:"Entitlement and dependency together — the operating system has produced a posture of expectation without ownership. The family expects rescue but resists responsibility. This is not laziness — it is the rational product of a system that has consistently rewarded helplessness.",c:"The Jackal pattern: deferred hope has converted to expectation of provision without the agency to steward it."});

  if(mindFlags.length>0&&!isClientMode()){
    out+='<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">';
    mindFlags.forEach(function(pt){
      out+='<div style="padding:10px 14px;background:var(--cream);border-left:3px solid var(--warn);border-radius:3px">';
      out+='<div style="font-size:12px;color:var(--deep);line-height:1.5;margin-bottom:4px">'+pt.t+'</div>';
      out+='<div style="font-size:11px;color:var(--warn);font-style:italic">'+pt.c+'</div>';
      out+="</div>";
    });
    out+="</div>";
  }
  out+="</div>";

  // Adaptive survival map
  out+='<div class="question-card" style="border-left-color:var(--warn);margin-top:16px">';
  out+='<div class="q-label" style="color:var(--warn)">Adaptive Survival Report — The Formation Chain</div>';
  out+='<div class="q-text">Map the formation chain for the primary operating pattern in this family.</div>';
  out+='<div class="q-sub">This maps how an original event became the current governing system. Fill in what is known — leave blank what is not yet accessible.</div>';

  var chainItems=[
    {key:"egypt_chain_event",label:"Original Event or Condition",placeholder:"What happened, or what was the chronic condition? (e.g. father's abandonment / poverty / abuse / migration)"},
    {key:"egypt_chain_adaptation",label:"Primary Adaptation",placeholder:"How did the family adapt to survive this? (e.g. 'we stopped asking for help' / 'we performed to earn safety' / 'we kept secrets')"},
    {key:"egypt_chain_pattern",label:"Repeated Pattern",placeholder:"What pattern formed from the adaptation? (e.g. chronic independence that cannot receive help / performance culture that punishes weakness)"},
    {key:"egypt_chain_governance",label:"Current Governance",placeholder:"How is this pattern now governing the household? (e.g. 'the children are raised to depend on no one' / 'failure is not permitted')"}
  ];
  chainItems.forEach(function(item,i){
    var cur=d[item.key]||"";
    out+='<div style="margin-top:12px'+(i>0?';padding-top:12px;border-top:1px solid var(--border)':'')+';">';
    if(i>0) out+='<div style="font-size:18px;color:var(--muted);text-align:center;margin-bottom:8px">↓</div>';
    out+='<div style="font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--warn);margin-bottom:4px">'+(i+1)+'. '+item.label+'</div>';
    out+='<textarea class="text-input" rows="2" placeholder="'+item.placeholder+'" oninput="save(\''+item.key+'\',this.value)" style="min-height:50px">'+cur+'</textarea>';
    out+="</div>";
  });
  out+="</div>";

  // Normalization assessment
  out+='<div class="question-card gold-card" style="margin-top:16px">';
  out+='<div class="q-label">Normalization Assessment</div>';
  out+='<div class="q-text">How normalized is the current dysfunction?</div>';
  var normOpts=[
    {v:"acute",l:"Acute — the family knows something is wrong and it still feels wrong. The pain has not been normalized."},
    {v:"partial",l:"Partial — the family has partially adapted. Some patterns feel normal, others still register as problems."},
    {v:"deep",l:"Deep normalization — the patterns have been present long enough that they no longer feel abnormal. This is simply life."},
    {v:"generational",l:"Generational normalization — the patterns predate this household and are not experienced as dysfunction at all. They are understood as culture, personality, or God's sovereign will."}
  ];
  var curNorm=d.egypt_normalization||null;
  out+='<div class="options-col" style="gap:6px;margin-top:8px">';
  normOpts.forEach(function(o){
    out+='<button class="option-btn '+(curNorm===o.v?"selected":"")+'" onclick="save(\'egypt_normalization\',\''+o.v+'\');renderStep()" style="font-size:12px;text-align:left">'+o.l+"</button>";
  });
  out+="</div>";
  if(curNorm==="generational"&&!isClientMode()){
    out+='<div style="margin-top:8px;padding:8px 12px;background:#FDF3F0;border-left:3px solid var(--warn);border-radius:3px;font-size:12px;color:var(--deep);line-height:1.5">Generational normalization is the most clinically significant category. This family is not aware that what they are experiencing is not universal. The first restoration task is helping them see the ruin as ruin — which requires a reference point they do not currently have. Scripture must provide the reference point before any diagnostic framework can be received.</div>';
  }
  out+="</div>";

  out+=navRow(selMind.length>0||!!d.egypt_normalization);
  out+="</div>";
  return out;
}


function getEgyptianReportHTML(){
  var d=state.data;
  var selMind=d.egypt_mindsets||[];
  if(!selMind.length&&!d.egypt_normalization&&!d.egypt_chain_event) return"";

  var mindLabels={
    scarcity:"Scarcity",fear:"Fear",performance:"Performance",dependency:"Dependency",
    control:"Control",survival:"Survival",shame:"Shame",entitlement:"Entitlement",fatalism:"Fatalism"
  };
  var normLabels={
    acute:"Acute — still registers as painful",partial:"Partial normalization",
    deep:"Deep normalization — patterns no longer feel abnormal",
    generational:"Generational normalization — experienced as culture, not dysfunction"
  };
  var normColors={acute:"#4A8A4A",partial:"#B8860B",deep:"var(--warn)",generational:"#8B1A1A"};

  var h='<div class="diag-panel" style="border-color:var(--warn)">';
  h+='<div class="diag-panel-header" style="background:#FDF3F0;border-bottom:2px solid var(--warn)" onclick="togglePanel(this)">';
  h+='<h3>Egyptian Formation — '+selMind.length+' Mindset'+(selMind.length!==1?"s":"")+' · '+(normLabels[d.egypt_normalization]||"Normalization not assessed")+'</h3>';
  h+='<div class="chevron">▼</div></div>';
  h+='<div class="diag-panel-body">';

  if(d.egypt_normalization){
    h+='<div class="finding-row"><div class="finding-dot" style="background:'+(normColors[d.egypt_normalization]||"var(--warn)")+'"></div>';
    h+='<div><div class="finding-text">Normalization Level: '+normLabels[d.egypt_normalization]+'</div>';
    if(d.egypt_normalization==="generational")
      h+='<div class="finding-sub" style="color:#8B1A1A">Critical — the family has no internal reference point for what health looks like. Scripture must provide the reference before any diagnostic framework can be received. The restoration entry point is vision, not diagnosis.</div>';
    h+="</div></div>";
  }

  if(selMind.length>0){
    h+='<div class="finding-row"><div class="finding-dot dot-warn"></div>';
    h+='<div><div class="finding-text">Active Mindsets ('+selMind.length+'): '+selMind.map(function(v){return mindLabels[v]||v;}).join(" · ")+'</div>';
    h+='<div class="finding-sub">These mindsets are not character flaws — they are the rational products of the formation history. They will resist being treated as preferences; they must be understood as the cognitive architecture of the Egyptian operating system.</div></div></div>';
  }

  // Formation chain
  var chainFilled=[d.egypt_chain_event,d.egypt_chain_adaptation,d.egypt_chain_pattern,d.egypt_chain_governance].filter(function(v){return v&&v.trim();});
  if(chainFilled.length>0){
    var chainLabels=["Original Event","Adaptation","Repeated Pattern","Current Governance"];
    var chainKeys=["egypt_chain_event","egypt_chain_adaptation","egypt_chain_pattern","egypt_chain_governance"];
    h+='<div class="finding-row"><div class="finding-dot dot-warn"></div>';
    h+='<div><div class="finding-text">Formation Chain Traced ('+chainFilled.length+' of 4 links identified)</div>';
    chainKeys.forEach(function(k,i){
      if(d[k]&&d[k].trim())
        h+='<div class="finding-sub" style="margin-top:4px"><strong>'+chainLabels[i]+':</strong> '+d[k]+'</div>';
    });
    h+="</div></div>";
  }

  // Timeline events
  var evKeys=["egypt_event_1","egypt_event_2","egypt_event_3","egypt_event_4"];
  var evFilled=evKeys.filter(function(k){return d[k]&&d[k].trim();});
  if(evFilled.length>0){
    h+='<div class="finding-row"><div class="finding-dot dot-warn"></div>';
    h+='<div><div class="finding-text">Formation Timeline ('+evFilled.length+' event'+(evFilled.length!==1?"s":"")+' recorded)</div>';
    evFilled.forEach(function(k,i){
      h+='<div class="finding-sub" style="margin-top:4px"><strong>Event '+(i+1)+':</strong> '+d[k]+'</div>';
    });
    h+='<div class="finding-sub" style="margin-top:6px;color:var(--warn)">These events are the entry points of the Egyptian system. They reveal not only what happened but what the family learned about God, people, provision, and safety as a result.</div>';
    h+="</div></div>";
  }

  h+='</div></div>';
  return h;
}

var renderEgypt=renderEgyptian;
function renderSteps(){const steps=[renderProfile,renderIdentity,renderFamilyStructure,renderSerpent,renderJackal,renderDragon,renderGates,renderWalls,renderValley,renderBowen,renderAttachment,renderGovernance,renderLineage,renderEgypt,renderHunter,renderBee,renderReportStep];return steps[state.step]()}
function nextStep(){state.step=Math.min(state.step+1,STEPS.length-1);renderStep()}
function prevStep(){state.step=Math.max(state.step-1,0);renderStep()}
function startOver(){state.step=0;state.data={};renderStep()}
function togglePanel(header){const body=header.nextElementSibling;const chev=header.querySelector(".chevron");const isOpen=body.classList.contains("open");body.classList.toggle("open",!isOpen);chev.classList.toggle("open",!isOpen)}

function toggleEgyptMindset(val){if(!state.data.egypt_mindsets)state.data.egypt_mindsets=[];var idx=state.data.egypt_mindsets.indexOf(val);if(idx>-1)state.data.egypt_mindsets.splice(idx,1);else state.data.egypt_mindsets.push(val);renderStep();}
function toggleHunterPattern(val){if(!state.data.hunter_patterns)state.data.hunter_patterns=[];var idx=state.data.hunter_patterns.indexOf(val);if(idx>-1)state.data.hunter_patterns.splice(idx,1);else state.data.hunter_patterns.push(val);renderStep();}
function toggleHunterAdapt(val){if(!state.data.hunter_adaptations)state.data.hunter_adaptations=[];var idx=state.data.hunter_adaptations.indexOf(val);if(idx>-1)state.data.hunter_adaptations.splice(idx,1);else state.data.hunter_adaptations.push(val);renderStep();}
function toggleBeeStrength(val){if(!state.data.bee_strengths)state.data.bee_strengths=[];var idx=state.data.bee_strengths.indexOf(val);if(idx>-1)state.data.bee_strengths.splice(idx,1);else state.data.bee_strengths.push(val);renderStep();}
function toggleConflict(val){if(!state.data.conflict_styles)state.data.conflict_styles=[];var idx=state.data.conflict_styles.indexOf(val);if(idx>-1)state.data.conflict_styles.splice(idx,1);else state.data.conflict_styles.push(val);renderStep();}
function togglePresenting(val){if(!state.data.presenting_problems)state.data.presenting_problems=[];var idx=state.data.presenting_problems.indexOf(val);if(idx>-1)state.data.presenting_problems.splice(idx,1);else state.data.presenting_problems.push(val);renderStep();}
document.addEventListener('click',function(e){
    var sb=e.target.closest('[data-scale-key]');
  if(sb){save(sb.getAttribute('data-scale-key'),parseInt(sb.getAttribute('data-scale-val')));renderStep();return;}
var cb=e.target.closest('[data-conflict]');
  if(cb){toggleConflict(cb.getAttribute('data-conflict'));return;}
  var pb=e.target.closest('[data-presenting]');
  if(pb){togglePresenting(pb.getAttribute('data-presenting'));return;}
  var hp=e.target.closest('[data-hunter-pattern]');
  if(hp){var v=hp.getAttribute('data-hunter-pattern');if(!state.data.hunter_patterns)state.data.hunter_patterns=[];var idx=state.data.hunter_patterns.indexOf(v);if(idx>-1)state.data.hunter_patterns.splice(idx,1);else state.data.hunter_patterns.push(v);renderStep();return;}
  var bs=e.target.closest('[data-bee-strength]');
  if(bs){var v=bs.getAttribute('data-bee-strength');if(!state.data.bee_strengths)state.data.bee_strengths=[];var idx=state.data.bee_strengths.indexOf(v);if(idx>-1)state.data.bee_strengths.splice(idx,1);else state.data.bee_strengths.push(v);renderStep();return;}
  var br=e.target.closest('[data-bee-resource]');
  if(br){var v=br.getAttribute('data-bee-resource');if(!state.data.bee_resources)state.data.bee_resources=[];var idx=state.data.bee_resources.indexOf(v);if(idx>-1)state.data.bee_resources.splice(idx,1);else state.data.bee_resources.push(v);renderStep();return;}
  var ee=e.target.closest('[data-egypt-event]');
  if(ee){var v=ee.getAttribute('data-egypt-event');if(!state.data.egypt_events)state.data.egypt_events=[];var idx=state.data.egypt_events.indexOf(v);if(idx>-1)state.data.egypt_events.splice(idx,1);else state.data.egypt_events.push(v);renderStep();return;}
  var em=e.target.closest('[data-egypt-mindset]');
  if(em){var v=em.getAttribute('data-egypt-mindset');if(!state.data.egypt_mindsets)state.data.egypt_mindsets=[];var idx=state.data.egypt_mindsets.indexOf(v);if(idx>-1)state.data.egypt_mindsets.splice(idx,1);else state.data.egypt_mindsets.push(v);renderStep();return;}
});
function renderStep(){
  if(isClientMode()){
    if(clientLink.status!=="ok"){ return; }
    updateProgress();
    document.getElementById("appContent").innerHTML = state.submitted ? renderClientThanks() : renderSteps();
    window.scrollTo(0,0);
    clientQueueSave();
    return;
  }
  updateProgress();document.getElementById("appContent").innerHTML=renderSteps();window.scrollTo(0,0)
}
function renderClientThanks(){
  return '<div class="main"><div class="question-card" style="max-width:640px;margin:24px auto;text-align:center"><div class="q-text" style="font-size:20px">Thank you \u2014 your assessment has been submitted</div><div class="q-sub" style="margin-top:10px;line-height:1.7">Your practitioner has received your answers and will be in touch about next steps. You can close this page.</div></div></div>'+getClientSummaryHTML();
}
if(!isClientMode()) renderStep();
</script>
